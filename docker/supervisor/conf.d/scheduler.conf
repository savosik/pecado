; Планировщик Laravel (routes/console.php).
;
; До 2026-09-09 здесь был `cron -f` с crontab `php artisan schedule:run`. Debian-cron
; даёт заданиям PATH=/usr/bin:/bin (зашито в бинарник, окружение демона не
; наследуется), а php в образе php:8.3-fpm лежит в /usr/local/bin — задание
; каждую минуту падало с «php: not found» в /dev/null, и планировщик не
; отработал ни разу с запуска проекта. schedule:work делает то же, что cron:
; раз в минуту стартует schedule:run фоновым процессом и не ждёт его,
; а вывод складывает сюда, а не в /dev/null.
; Не от root: контейнер worker поднят `user: root`, и без этой строки schedule:run
; первым за сутки создавал laravel-YYYY-MM-DD.log как root:root 0644 — после
; этого до полуночи php-fpm (www-data) и воркеры (laravel) падали на любом Log::*
; (500 на входе под партнёром, 14.09.2026).
[program:scheduler]
command=php artisan schedule:work
user=laravel
directory=/var/www
autostart=true
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
