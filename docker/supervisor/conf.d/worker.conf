# ВАЖНО: Очереди erp_out.* (erp_out.orders, erp_out.returns, erp_out.partners)
# НЕ имеют Laravel-воркеров. Они предназначены для потребления 1С напрямую через AMQP.
# Сайт только публикует в них raw JSON через pushRaw().

[program:normalization-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=normalization --sleep=5 --tries=3 --backoff=30,60,120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/normalization-worker.log
stopwaitsecs=3600

# Воркер для обработки CSV-файлов индивидуальных цен из MinIO.
# 4 процесса — каждый файл ~5-10с, при 749 файлах ≈ 15-20 мин.
# timeout=1800 — один файл обрабатывается до 30 мин (крупные прайсы).
[program:prices-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=prices --sleep=5 --tries=3 --timeout=1800 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/prices-worker.log
stopwaitsecs=1800
