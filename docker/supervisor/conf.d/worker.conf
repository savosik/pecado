[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work rabbitmq --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
stopwaitsecs=3600

# Воркер фоновой загрузки медиа для каталога (DownloadProductMediaJob).
# Вынесен в отдельную supervisor-программу, чтобы массовый импорт картинок
# не блокировал остальные default-задачи (раньше было --queue=catalog-media,default
# и default голодал, пока catalog-media не разгрузится).
[program:catalog-media-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work rabbitmq --queue=catalog-media --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=12
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/catalog-media-worker.log
stopwaitsecs=3600

# Воркер генерации миниатюр (Spatie media conversions). Очередь media-conversions
