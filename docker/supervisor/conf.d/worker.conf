# Воркер для обработки CSV-файлов индивидуальных цен из MinIO.
# 4 процесса — каждый файл ~5-10с, при 749 файлах ≈ 15-20 мин.
# timeout=1800 — один файл обрабатывается до 30 мин (крупные прайсы).
[program:prices-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=prices --sleep=5 --tries=3 --timeout=1800 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/prices-worker.log
stopwaitsecs=1800

# Воркер для асинхронной генерации стандартных пресетных выгрузок.
# Генерация идёт в HTTP-неблокирующем режиме: контроллер /export/{hash} только
# диспатчит GenerateProductExportJob и отдаёт stale-файл или 202; сам файл
# собирается здесь. timeout=1500 покрывает крупные каталоги (10k+ товаров).
#
# numprocs=2 — горячий резерв: warmup-джобы (раз в 15 мин) и HTTP-driven
# джобы партнёров (нажал «Получить ссылку») делят очередь, второй процесс
# защищает от голодания. Поднимать выше 4 смысла мало — генерация CPU-bound.
[program:exports-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=exports --sleep=3 --tries=3 --timeout=1500 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/exports-worker.log
stopwaitsecs=1500
