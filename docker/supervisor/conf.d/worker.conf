# Воркер внутренних publish-job-ов сайт → 1С (PublishContractorToErpJob,
# PublishUserToErpJob, PublishOrderToErpJob, PublishReturnToErpJob).
# Эти job-обёртки лежат в очереди erp_publish и в handle() публикуют raw JSON
# в шинные очереди erp_out.* через pushRaw(). Выделена отдельно от laravel-worker,
# чтобы массовый импорт медиа (catalog-media) не блокировал критичные ERP-публикации.
[program:erp-publish-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work rabbitmq --queue=erp_publish --sleep=3 --tries=5 --backoff=30 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/erp-publish-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600

# ВАЖНО: Очереди erp_out.* (erp_out.orders, erp_out.returns, erp_out.partners,
# erp_out.contractors) НЕ имеют Laravel-воркеров. Они предназначены для
# потребления 1С напрямую через AMQP. Сайт только публикует в них raw JSON
# через pushRaw() из handle() job-ов erp_publish-воркера.

# Consumer внешних остатков (external.remains_for_website) отключён 2026-06-11 (v15.2):
# сайт больше не потребляет внешние остатки, очередь удалена из топологии.
# 1С продолжает получать остатки через external.remains_for_erp.

[program:normalization-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=normalization --sleep=5 --tries=3 --backoff=30,60,120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/normalization-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600

# Воркер для обработки CSV-файлов индивидуальных цен из MinIO.
# 4 процесса — каждый файл ~5-10с, при 749 файлах ≈ 15-20 мин.
# timeout=1800 — один файл обрабатывается до 30 мин (крупные прайсы).
[program:prices-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=prices --sleep=5 --tries=3 --timeout=1800 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/prices-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=1800

# Воркер для асинхронной генерации стандартных пресетных выгрузок.
# Генерация идёт в HTTP-неблокирующем режиме: контроллер /export/{hash} только
# Генерация выгрузок разделена на два pool'а по estimated_rows
# (GenerateProductExportJob выбирает очередь в конструкторе):
#   - exports-light  (rows < 1000): больше процессов, короткий timeout —
#     быстрые партнёрские выборки не блокируются за крупными прайсами;
#   - exports-heavy  (rows ≥ 1000): меньше процессов, длинный timeout под
#     каталоги 10k+.
# Оба слушают и legacy очередь `exports` — pending-jobs прошлых деплоев
# не зависают. Через час после релиза `exports` опустеет навсегда.
[program:exports-light-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=exports-light,exports --sleep=3 --tries=3 --timeout=180 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/exports-light-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=180

[program:exports-heavy-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=exports-heavy,exports --sleep=3 --tries=3 --timeout=1500 --memory=256 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=laravel
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/exports-heavy-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=1500
