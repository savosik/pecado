# docker/nginx/prod.conf
#
# Production nginx config с HTTPS (Let's Encrypt).
# Сертификаты получены через `certbot certonly --webroot -w /var/www/certbot`.
# Auto-renewal: systemd timer `certbot.timer` + hook `/etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh`.
#
# До получения SSL использовался HTTP-only bootstrap (см. историю git).
# Шаблон с инструкцией по bootstrap — в `prod-https.conf.example` (пустой example после применения,
# оставлен в репо как точка отсчёта для другого окружения).

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    server_name pecado.ru www.pecado.ru;

    # ACME challenge должен работать по HTTP даже после получения cert (для renew)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API-клиенты могут ошибочно обратиться по http. Обычный 301 заставляет
    # HTTP-клиенты переотправить запрос как GET и потерять тело — POST /orders
    # тихо ломается. 308 сохраняет метод и тело запроса при редиректе на https.
    location ^~ /api/ {
        return 308 https://$host$request_uri;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → non-www redirect ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.pecado.ru;

    ssl_certificate /etc/letsencrypt/live/pecado.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pecado.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # API — 308, чтобы POST-запросы (создание заказа) не теряли тело при
    # редиректе с www на основной домен.
    location ^~ /api/ {
        return 308 https://pecado.ru$request_uri;
    }

    return 301 https://pecado.ru$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name pecado.ru;

    # SSL
    ssl_certificate /etc/letsencrypt/live/pecado.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pecado.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net https://mc.yandex.ru https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.bunny.net; connect-src 'self' wss: https://api-maps.yandex.ru https://*.maps.yandex.net https://*.maps.yandex.ru https://yandex.ru https://mc.yandex.ru https://*.mc.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com;" always;

    # Основные настройки
    index index.php index.html;
    client_max_body_size 100M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_read_timeout 60;
    }

    # ── AsyncAPI документация ──────────────────────────────────────────
    location ^~ /docs/erp/spec.yaml {
        alias /var/www/docs/asyncapi/pecado-erp-bundled.yaml;
        default_type "text/yaml; charset=utf-8";
    }

    location ^~ /docs/erp/schemas/ {
        alias /var/www/app/Services/Erp/Schemas/;
        default_type "application/json; charset=utf-8";
        autoindex on;
    }

    location ^~ /docs/erp/ {
        alias /var/www/docs/asyncapi/html/;
        index index.html;
    }

    # ── MkDocs ─────────────────────────────────────────────────────────
    location ^~ /docs/erp-guide/ {
        alias /var/www/docs-erp/site/;
        index index.html;
    }

    location ^~ /docs/test-plan/ {
        alias /var/www/docs-testing/site/;
        index index.html;
    }

    # ── Длинные синхронные экспорты ───────────────────────────────────
    location ^~ /export/ {
        try_files $uri @export_php;
    }

    location @export_php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Internal location для X-Accel-Redirect из ProductExportDownloadController.
    # Контроллер проверяет права и отдаёт заголовок X-Accel-Redirect:
    # /__internal_exports/{hash}; nginx сам стримит файл с диска, минуя PHP.
    # Снимает таймауты/буферизацию PHP-FPM для крупных выгрузок (10+ MB) —
    # для каталога 5к товаров CSV ~16 MB через PHP не вытягивался даже
    # с fastcgi_read_timeout 300s (recv-timeout на стороне клиента).
    location ^~ /__internal_exports/ {
        internal;
        alias /var/www/storage/app/exports/;
        access_log off;
    }

    # ── Публичные медиа (MinIO bucket `pecado`) ────────────────────────
    # AWS_URL=https://pecado.ru/storage → проксируем в MinIO. Префикс `^~`
    # имеет приоритет над regex-блоком статики ниже, иначе nginx ищет файлы
    # локально в /var/www/public/storage/ и отдаёт 404.
    location ^~ /storage/ {
        rewrite ^/storage/(.*)$ /pecado/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Laravel default ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # ── Статика с долгим кешем ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # ── Защита от прямого доступа к чувствительным файлам ─────────────
    location ~ /\. {
        deny all;
    }

    location ~* (\.env|composer\.(json|lock)|package(-lock)?\.json|webpack\.mix\.js|artisan)$ {
        deny all;
    }
}
