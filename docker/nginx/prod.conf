# docker/nginx/prod.conf
#
# ⚠️ BOOTSTRAP-ВЕРСИЯ (HTTP only).
#
# Этот файл — стартовая конфигурация для первого запуска прод-стека ДО получения SSL.
# Содержит:
#   - Поддержку ACME challenge для Let's Encrypt (`/.well-known/acme-challenge/`).
#   - Все основные locations Laravel/AsyncAPI/MkDocs/Export (как на dev).
#   - Без HTTPS — порт 443 в этом конфиге не слушается.
#
# 🔒 ПОСЛЕ получения SSL через certbot заменить содержимое этого файла на
# полную конфигурацию с HTTPS-блоком и редиректом 80 → 443.
# Шаблон финального конфига — в `docs/CICD_PROD_DEPLOYMENT.md §3.2`.
# (Или скопировать из `docker/nginx/prod-https.conf.example` если он создан.)

server {
    listen 80;
    server_name pecado.ru www.pecado.ru;

    # ACME challenge для Let's Encrypt — должен быть доступен по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Laravel / Inertia / Admin ──────────────────────────────────────
    index index.php index.html;
    client_max_body_size 100M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (даже без HTTPS — на будущее)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_read_timeout 60;
    }

    # ── AsyncAPI документация ──────────────────────────────────────────
    location ^~ /docs/erp/spec.yaml {
        alias /var/www/docs/asyncapi/pecado-erp-bundled.yaml;
        default_type "text/yaml; charset=utf-8";
    }

    location ^~ /docs/erp/schemas/ {
        alias /var/www/app/Services/Erp/Schemas/;
        default_type "application/json; charset=utf-8";
        autoindex on;
    }

    location ^~ /docs/erp/ {
        alias /var/www/docs/asyncapi/html/;
        index index.html;
    }

    # ── MkDocs ─────────────────────────────────────────────────────────
    location ^~ /docs/erp-guide/ {
        alias /var/www/docs-erp/site/;
        index index.html;
    }

    location ^~ /docs/test-plan/ {
        alias /var/www/docs-testing/site/;
        index index.html;
    }

    # ── Длинные синхронные экспорты (до 5 минут) ──────────────────────
    location ^~ /export/ {
        try_files $uri @export_php;
    }

    location @export_php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # ── Laravel default ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # ── Статика с долгим кешем ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # ── Защита от прямого доступа к чувствительным файлам ─────────────
    location ~ /\. {
        deny all;
    }

    location ~* (\.env|composer\.(json|lock)|package(-lock)?\.json|webpack\.mix\.js|artisan)$ {
        deny all;
    }
}
