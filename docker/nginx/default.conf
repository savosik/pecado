server {
    listen 80;
    index index.php index.html;
    client_max_body_size 100M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
    }

    # AsyncAPI документация для разработчика 1С
    # HTML: /docs/erp/ — интерактивная документация
    # YAML: /docs/erp/spec.yaml — сырая спецификация для AI-агентов
    # JSON: /docs/erp/schemas/*.json — JSON Schema файлы для валидации
    location /docs/erp/spec.yaml {
        alias /var/www/docs/asyncapi/pecado-erp-integration.yaml;
        default_type "text/yaml; charset=utf-8";
    }

    location /docs/erp/schemas/ {
        alias /var/www/app/Services/Erp/Schemas/;
        default_type "application/json; charset=utf-8";
        autoindex on;
    }

    location /docs/erp/ {
        alias /var/www/docs/asyncapi/html/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}
