# ═══════════════════════════════════════════════════════════════════════════
# ЛОКАЛЬНЫЙ конфиг nginx — только для машины разработчика.
#
# Подключается через docker-compose.override.yml (файл в .gitignore), поэтому
# ни на dev, ни на prod не применяется:
#   dev  → docker/nginx/default.conf
#   prod → docker/nginx/prod.conf
#
# Отличие от default.conf ровно одно: фолбэк медиа на прод (location
# @media_from_prod) плюс кэш под него. Всё остальное — копия. Если правите
# default.conf, перенесите изменения и сюда.
# ═══════════════════════════════════════════════════════════════════════════

# Кэш медиа, добираемых с прода (см. location @media_from_prod ниже).
# Без него каждый скролл каталога заново тянет мегабайты по сети: картинки
# товаров весят по 0,5–3 MB, а локальный MinIO почти пуст. Файл лежит внутри
# контейнера, при пересоздании обнуляется — это просто кэш, не хранилище.
proxy_cache_path /var/cache/nginx/prod-media
                 levels=1:2
                 keys_zone=prod_media:10m
                 max_size=2g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    index index.php index.html;
    client_max_body_size 100M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
    }

    # AsyncAPI документация для разработчика 1С
    # HTML: /docs/erp/ — интерактивная документация
    # YAML: /docs/erp/spec.yaml — сырая спецификация для AI-агентов
    # JSON: /docs/erp/schemas/*.json — JSON Schema файлы для валидации
    location ^~ /docs/erp/spec.yaml {
        alias /var/www/docs/asyncapi/pecado-erp-bundled.yaml;
        default_type "text/yaml; charset=utf-8";
    }

    location ^~ /docs/erp/schemas/ {
        alias /var/www/app/Services/Erp/Schemas/;
        default_type "application/json; charset=utf-8";
        autoindex on;
    }

    location ^~ /docs/erp/ {
        alias /var/www/docs/asyncapi/html/;
        index index.html;
    }

    # MkDocs — бизнес-правила и тест-план интеграции
    location ^~ /docs/erp-guide/ {
        alias /var/www/docs-erp/site/;
        index index.html;
    }

    # MkDocs — ручной тест-план B2B-клиента
    location ^~ /docs/test-plan/ {
        alias /var/www/docs-testing/site/;
        index index.html;
    }

    # Стандартные выгрузки: синхронная генерация может занять до 5 минут.
    # Дефолтный fastcgi_read_timeout (60с) мал — отдельный location с запасом.
    location ^~ /export/ {
        try_files $uri @export_php;
    }

    location @export_php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Internal location для X-Accel-Redirect из ProductExportDownloadController —
    # nginx стримит файл с диска напрямую, минуя PHP-FPM (нужно для крупных
    # выгрузок 10+ MB, где PHP не успевает отдать всё за recv-timeout).
    #
    # gzip_static — если рядом с {hash} лежит {hash}.gz (создаёт
    # ProductExportGenerator после генерации для CSV/JSON/XML), и клиент
    # прислал Accept-Encoding: gzip, отдаём заранее сжатую копию.
    # Партнёрский 53 МБ JSON отдаётся как 5-7 МБ.
    location ^~ /__internal_exports/ {
        internal;
        alias /var/www/storage/app/exports/;
        access_log off;
        gzip_static on;
    }

    # Публичные медиа (MinIO bucket `pecado`) с фолбэком на прод.
    #
    # AWS_URL=http://loc.pecado.ru/storage → проксируем в MinIO. `^~` приоритетнее
    # regex ниже, иначе nginx ищет файлы локально в /var/www/public/storage/ и
    # отдаёт 404.
    #
    # Локальный MinIO почти пустой: база приезжает с прода (`make db-pull-prod`),
    # а 50 тысяч файлов медиа — нет. Без фолбэка весь каталог локально показывал
    # битые картинки. Поэтому: нет объекта в MinIO → добираем с боевого сайта,
    # который отдаёт те же пути публично (AWS_URL=https://pecado.ru/storage).
    #
    # Фолбэк ТОЛЬКО на чтение и только локально: этот файл на серверы не едет,
    # у прода свой docker/nginx/prod.conf.
    location ^~ /storage/ {
        rewrite ^/storage/(.*)$ /pecado/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;

        # MinIO на отсутствующий объект отвечает 404, а без прав на листинг — 403.
        # Перехватываем оба и уходим на прод.
        proxy_intercept_errors on;
        error_page 403 404 = @media_from_prod;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Фолбэк: та же картинка с боевого сайта.
    # $request_uri сохраняет исходный путь (/storage/…), несмотря на rewrite выше.
    location @media_from_prod {
        # Резолвер нужен, потому что адрес в proxy_pass содержит переменную:
        # без него nginx попытается разрешить имя на старте и упадёт.
        # 127.0.0.11 — встроенный DNS Docker, внешние домена он тоже резолвит.
        resolver 127.0.0.11 8.8.8.8 valid=30s;
        resolver_timeout 5s;

        proxy_pass https://pecado.ru$request_uri;
        proxy_set_header Host pecado.ru;
        proxy_ssl_server_name on;          # SNI, иначе TLS-хендшейк не пройдёт
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;

        # Кэшируем ответы прода на диске: иначе каждый скролл каталога тянет
        # те же мегабайты заново. Ключ — только путь: авторизации тут нет.
        proxy_cache prod_media;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5m;          # чтобы битый путь не долбил прод
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;               # 10 карточек сразу → один запрос наружу

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Media-Source "prod-fallback" always;
        add_header X-Media-Cache $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}
