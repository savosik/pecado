# Прокси слушает только внутреннюю docker-сеть, наружу порт не публикуется.
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Info

# Весь трафик уходит в SOCKS5 SSH-туннеля. Имя хоста резолвит уже VPS,
# поэтому подмена openrouter.ai на IP заглушки местным DNS роли не играет.
upstream socks5 127.0.0.1:1080

# Разрешаем только docker-сети — снаружи прокси недоступен в принципе.
Allow 127.0.0.1
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# CONNECT только на HTTPS — прокси не должен превращаться в универсальный туннель.
ConnectPort 443

DisableViaHeader Yes
