; Переопределение пула php-fpm (базовый образ даёт pm.max_children = 5).
; Пяти воркеров не хватает: long-poll agent-hub (до 25 с на запрос) плюс
; опрос админской страницы топиков занимают весь пул, и сайт отдаёт 504.
; Монтируется в /usr/local/etc/php-fpm.d/zz-www-pool.conf (см. docker-compose.yml).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
