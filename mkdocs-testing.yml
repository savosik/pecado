site_name: Pecado — Ручной тест-план B2B-клиента
site_description: Пошаговое тестирование сайта Pecado глазами B2B-клиента
site_url: https://dev.pecado.ru/docs/test-plan/
docs_dir: docs-testing/content
site_dir: docs-testing/site

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Светлая тема
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Обзор: index.md
  - Как работать с планом:
    - Порядок работы: intro/how-to-work.md
    - Багрекер (главный инструмент): intro/bugtracker.md
    - Обмен с 1С (фоновая синхронизация): intro/erp-sync.md
    - Устройства и браузеры: intro/devices.md
    - Подготовка и доступы: intro/prep.md
  - Этапы тестирования:
    - "ЭТАП 0. Гость": stages/00-guest.md
    - "ЭТАП 1. Регистрация": stages/01-registration.md
    - "ЭТАП 2. Онбординг": stages/02-onboarding.md
    - "ЭТАП 3. Дашборд ЛК": stages/03-dashboard.md
    - "ЭТАП 4. Профиль, компания, адреса": stages/04-profile-company.md
    - "ЭТАП 5. Каталог (авторизованный)": stages/05-catalog.md
    - "ЭТАП 6. Поиск (авторизованный)": stages/06-search.md
    - "ЭТАП 7. Корзины": stages/07-carts.md
    - "ЭТАП 8. Оформление заказа": stages/08-checkout.md
    - "ЭТАП 9. Отслеживание заказов": stages/09-orders.md
    - "ЭТАП 10. Отгрузки": stages/10-shipments.md
    - "ЭТАП 11. Возвраты": stages/11-returns.md
    - "ЭТАП 12. Выгрузки": stages/12-exports.md
    - "ЭТАП 13. API-токены": stages/13-api-tokens.md
    - "ЭТАП 14. Статические страницы": stages/14-cms-pages.md
    - "ЭТАП 15. Темы, адаптивность, a11y": stages/15-themes-responsive-a11y.md
    - "ЭТАП 16. Смена пароля": stages/16-change-password.md
    - "ЭТАП 17. Восстановление пароля": stages/17-password-recovery.md
    - "ЭТАП 18. Выход": stages/18-logout.md
    - "ЭТАП 19. Лояльный клиент": stages/19-loyal-client.md
  - Edge-кейсы:
    - Обзор: edge-cases/index.md
    - "E.1. Блокированный клиент": edge-cases/blocked-client.md
    - "E.2. Кросс-авторизация": edge-cases/cross-auth.md
    - "E.3. Локали и символы": edge-cases/locales.md
    - "E.4. Длинные значения": edge-cases/long-values.md
    - "E.5. Медленный интернет": edge-cases/slow-network.md
    - "E.6. Офлайн": edge-cases/offline.md
    - "E.7. Многооконность": edge-cases/multi-window.md
    - "E.8. Валюта": edge-cases/currency.md
    - "E.9. Проверка багрекера": edge-cases/bugtracker-check.md
    - "E.10. Регрессия после деплоя": edge-cases/regression.md
  - Итоги: summary.md
  - Связанные ресурсы:
    - "ERP-интеграция (гайд)": https://dev.pecado.ru/docs/erp-guide/
    - "AsyncAPI (интерактивная)": https://dev.pecado.ru/docs/erp/
    - "Публичный API (Scramble)": https://dev.pecado.ru/docs/api
