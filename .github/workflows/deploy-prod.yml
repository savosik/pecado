name: Deploy to Production

on:
  push:
    branches:
      - main

# Прод-деплой не отменяется на лету — он должен завершиться полностью.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Линтинг и тесты (БЕЗ fast-lane! на проде гоняем всегда)
  # ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Lint & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      mysql-prices:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_prices_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - "5672:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, redis, pcntl, sockets
          coverage: none

      - name: "📦 Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "📦 Install PHP dependencies"
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: "⚙️ Prepare .env for tests"
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=sqlite|DB_CONNECTION=mysql|' .env
          cat >> .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=pecado_test
          DB_USERNAME=pecado
          DB_PASSWORD=secret
          DB_PRICES_HOST=127.0.0.1
          DB_PRICES_PORT=3307
          DB_PRICES_DATABASE=pecado_prices_test
          DB_PRICES_USERNAME=pecado
          DB_PRICES_PASSWORD=secret
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=log
          SCOUT_DRIVER=null
          RABBITMQ_HOST=127.0.0.1
          RABBITMQ_PORT=5672
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          EOF
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions
          mkdir -p bootstrap/cache
          php artisan key:generate
          php artisan package:discover --ansi

          # Фейковый Vite manifest, чтобы Blade/Inertia views рендерились в тестах
          mkdir -p public/build
          echo '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.jsx":{"file":"assets/app.js","src":"resources/js/app.jsx","isEntry":true}}' > public/build/manifest.json

      - name: "🗃️ Run migrations"
        run: php artisan migrate --force

      - name: "✅ Run tests"
        run: php artisan test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Сборка фронтенда + AsyncAPI + MkDocs
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: "⚡ Build Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Node dependencies"
        run: npm ci

      - name: "🏗️ Build assets"
        run: npm run build

      - name: "📄 Build AsyncAPI docs (validate + bundle + HTML)"
        run: npm run asyncapi:build

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📚 Build MkDocs (ERP guide)"
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: "📚 Build MkDocs (Manual test plan)"
        run: mkdocs build -f mkdocs-testing.yml --strict

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 7

      - name: "📤 Upload AsyncAPI docs"
        uses: actions/upload-artifact@v4
        with:
          name: asyncapi-docs
          path: |
            docs/asyncapi/html
            docs/asyncapi/pecado-erp-bundled.yaml
          retention-days: 7

      - name: "📤 Upload MkDocs site"
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: docs-erp/site
          retention-days: 7

      - name: "📤 Upload MkDocs testing site"
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-testing-site
          path: docs-testing/site
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Деплой на Prod-сервер
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: [self-hosted, prod-server]
    needs: [test, build-frontend]
    timeout-minutes: 30
    environment:
      name: production
      url: https://pecado.ru

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Download frontend build"
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: "📥 Download AsyncAPI docs"
        uses: actions/download-artifact@v4
        with:
          name: asyncapi-docs
          path: docs/asyncapi

      - name: "📥 Download MkDocs site"
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: docs-erp/site

      - name: "📥 Download MkDocs testing site"
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-testing-site
          path: docs-testing/site

      - name: "🔧 Fix Docker file ownership"
        run: |
          # Docker создаёт файлы от root — rsync не может их перезаписать.
          # Возвращаем владельца на runner-юзера через alpine + bind mount.
          CURRENT_UID=$(id -u)
          CURRENT_GID=$(id -g)
          sg docker -c "docker run --rm -v /srv/pecado/public/build:/build alpine chown -R ${CURRENT_UID}:${CURRENT_GID} /build" 2>/dev/null || true

      - name: "💾 Pre-deploy backup БД"
        run: |
          set -euo pipefail
          # Хранилище — на отдельном диске /dev/sdb (/media), чтобы не забивать системный sda2.
          BACKUP_DIR="/media/backups/mysql/pre-deploy"
          mkdir -p "$BACKUP_DIR"
          DATE=$(date +%Y-%m-%d_%H%M%S)
          cd /srv/pecado
          DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          # Если контейнеры ещё не запущены (первый деплой) — пропускаем backup
          if sg docker -c "$DC ps --status running --quiet mysql" | grep -q .; then
            echo "==> Backup main DB..."
            sg docker -c "$DC exec -T mysql sh -c 'exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" pecado'" \
              | gzip > "$BACKUP_DIR/pecado_${DATE}.sql.gz"

            echo "==> Backup prices DB..."
            sg docker -c "$DC exec -T mysql-prices sh -c 'exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" pecado_prices'" \
              | gzip > "$BACKUP_DIR/pecado_prices_${DATE}.sql.gz"

            # Retention основной БД: оставляем 10 последних
            echo "==> Rotation main DB (keep last 10)..."
            ls -1t "$BACKUP_DIR"/pecado_*.sql.gz 2>/dev/null | grep -v '/pecado_prices_' | tail -n +11 | xargs -r rm -fv

            # Retention БД цен: оставляем только 5 последних — таблицы цен большие,
            # архивы могут забить диск даже сжатыми.
            echo "==> Rotation prices DB (keep last 5)..."
            ls -1t "$BACKUP_DIR"/pecado_prices_*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -fv

            echo "==> Pre-deploy backup OK: ${DATE}"
            df -h /media | tail -1
          else
            echo "==> Контейнеры не запущены, backup пропускаем (первый деплой)"
          fi

      - name: "📤 Sync code to /srv/pecado"
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='bootstrap/cache' \
            --exclude='public/hot' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/app/exports' \
            --exclude='storage/app/public' \
            ./ /srv/pecado/

      - name: "🐳 Deploy"
        run: |
          set -euo pipefail
          cd /srv/pecado
          DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          echo "==> [0/9] Maintenance mode ON..."
          sg docker -c "$DC exec -T app php artisan down --retry=30 --refresh=5" || true

          echo "==> [1/9] Установка PHP зависимостей..."
          sg docker -c "$DC exec -T app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative"

          echo "==> [1.5/9] Создание symlink public/storage (если ещё нет)..."
          sg docker -c "$DC exec -T app php artisan storage:link" || true

          echo "==> [2/9] Очистка и прогрев кешей Laravel..."
          sg docker -c "$DC exec -T app php artisan optimize:clear"
          sg docker -c "$DC exec -T app php artisan config:cache"
          sg docker -c "$DC exec -T app php artisan route:cache"
          sg docker -c "$DC exec -T app php artisan view:cache"
          sg docker -c "$DC exec -T app php artisan event:cache"
          sg docker -c "$DC exec -T app php artisan optimize"

          echo "==> [3/9] Запуск и ожидание prices DB..."
          sg docker -c "$DC up -d mysql-prices"
          for i in $(seq 1 30); do
            STATUS=$(sg docker -c "docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' pecado-mysql-prices" 2>/dev/null || echo "missing")
            [ "$STATUS" = "healthy" ] && { echo "prices DB готова"; break; }
            [ "$i" -eq 30 ] && { echo "❌ mysql-prices не перешёл в healthy: $STATUS"; sg docker -c 'docker logs --tail 100 pecado-mysql-prices' || true; exit 1; }
            echo "Ожидание mysql-prices: $STATUS ($i/30)"
            sleep 2
          done

          echo "==> [4/9] Миграции (main DB + prices DB)..."
          sg docker -c "$DC exec -T app php artisan migrate --force"

          echo "==> [5/9] Синхронизация ролей и прав..."
          sg docker -c "$DC exec -T app php artisan db:seed --class=RolesAndPermissionsSeeder --force"

          echo "==> [6/9] RabbitMQ users + topology..."
          sg docker -c "$DC up -d rabbitmq"
          for i in $(seq 1 30); do
            sg docker -c "$DC exec -T rabbitmq rabbitmq-diagnostics ping" >/dev/null 2>&1 && { echo "RabbitMQ готов"; break; }
            [ "$i" -eq 30 ] && { echo "❌ RabbitMQ не поднялся"; sg docker -c 'docker logs --tail 100 pecado-rabbitmq' || true; exit 1; }
            sleep 2
          done

          # Provisioning пользователей RabbitMQ из /srv/pecado/.env
          set -a
          source /srv/pecado/.env
          set +a
          ensure_user() {
            local user="$1" pass="$2" tag="$3" conf="$4" write="$5" read="$6"
            if sg docker -c "$DC exec -T rabbitmq rabbitmqctl list_users" 2>/dev/null | awk '{print $1}' | grep -Fxq "$user"; then
              echo "  пользователь $user уже есть — обновляю пароль/права"
              sg docker -c "$DC exec -T rabbitmq rabbitmqctl change_password '$user' '$pass'"
            else
              echo "  создаю пользователя $user"
              sg docker -c "$DC exec -T rabbitmq rabbitmqctl add_user '$user' '$pass'"
            fi
            [ -n "$tag" ] && sg docker -c "$DC exec -T rabbitmq rabbitmqctl set_user_tags '$user' $tag"
            sg docker -c "$DC exec -T rabbitmq rabbitmqctl set_permissions -p / '$user' '$conf' '$write' '$read'"
          }
          ensure_user "${RABBITMQ_MANAGEMENT_USER}" "${RABBITMQ_MANAGEMENT_PASSWORD}" "administrator" ".*" ".*" ".*"
          ensure_user "${RABBITMQ_USER}"            "${RABBITMQ_PASSWORD}"            ""               ".*" ".*" ".*"
          if [ -n "${RABBITMQ_ERP_USER:-}" ] && [ -n "${RABBITMQ_ERP_PASSWORD:-}" ]; then
            ensure_user "${RABBITMQ_ERP_USER}"      "${RABBITMQ_ERP_PASSWORD}"        "" 'erp\..*|erp_out\..*|external\..*' 'erp\..*' 'erp_out\..*|external\..*'
          fi
          # Удаляем дефолтного guest для безопасности
          sg docker -c "$DC exec -T rabbitmq rabbitmqctl delete_user guest" 2>/dev/null || true

          # Топология (exchanges, queues, shovels)
          sg docker -c "$DC exec -T app php artisan rabbitmq:setup" || true

          echo "==> [7/9] Meilisearch settings + synonyms..."
          sg docker -c "$DC exec -T app php artisan scout:sync-index-settings" || true
          sg docker -c "$DC exec -T app php artisan meilisearch:sync-synonyms" || true

          echo "==> [8/9] Перезапуск очередей и контейнеров..."
          sg docker -c "$DC exec -T app php artisan queue:restart"
          sg docker -c "$DC restart app worker nginx"

          echo "==> [9/9] Maintenance mode OFF..."
          sg docker -c "$DC exec -T app php artisan up"

          echo ""
          echo "✅ Production деплой завершён!"

      - name: "🏥 Health Check"
        run: |
          sleep 5
          # Идём на 127.0.0.1 с Host:pecado.ru — обходим hairpin NAT (с самого
          # prod-сервера запрос на свой внешний IP не возвращается).
          # SNI выставляется через --resolve, поэтому SSL/HSTS-флоу проверяется
          # ровно тот же, что у внешних клиентов.
          HTTPS_CODE=$(curl -sk --resolve pecado.ru:443:127.0.0.1 -o /dev/null -w "%{http_code}" -m 10 https://pecado.ru/up 2>/dev/null || echo "000")
          HTTP_REDIRECT=$(curl -s --resolve pecado.ru:80:127.0.0.1 -o /dev/null -w "%{http_code}" -m 5 http://pecado.ru/up 2>/dev/null || echo "000")
          echo "https://pecado.ru/up via loopback: $HTTPS_CODE"
          echo "http://pecado.ru/up via loopback (ожидаем 301): $HTTP_REDIRECT"
          if [ "$HTTPS_CODE" = "200" ]; then
            echo "✅ Health check passed (HTTPS $HTTPS_CODE)"
          else
            echo "❌ Health check FAILED (HTTPS $HTTPS_CODE)"
            # Поднимаем сайт из maintenance, если он там завис
            docker compose -f /srv/pecado/docker-compose.yml -f /srv/pecado/docker-compose.prod.yml exec -T app php artisan up || true
            docker compose -f /srv/pecado/docker-compose.yml -f /srv/pecado/docker-compose.prod.yml logs --tail=50 nginx app || true
            exit 1
          fi

      - name: "📢 Notify on success"
        if: success()
        run: |
          echo "✅ Prod deploy successful!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
          # TODO: Telegram/Slack notification

      - name: "🔔 Notify on failure"
        if: failure()
        run: |
          echo "❌ Prod deploy FAILED!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
          # TODO: Telegram/Slack notification — на проде это критично!
