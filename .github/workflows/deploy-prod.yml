name: Deploy to Production

on:
  push:
    branches:
      - main

# Прод-деплой не отменяется на лету — он должен завершиться полностью.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 0: Уже прогоняли эти тесты на dev?
  # ─────────────────────────────────────────────────────────────
  # Релиз идёт через `git push origin dev:main`, то есть на прод приезжает
  # РОВНО тот же коммит, который перед этим позеленел на dev. Гонять на нём
  # тот же test suite второй раз — семь лишних минут простоя релиза.
  #
  # Пропускаем тесты, только если по этому же SHA выполнены ВСЕ условия:
  #   1. Есть завершённый прогон deploy-dev, и он успешен.
  #   2. В нём job «Lint & Tests» именно SUCCESS, а не skipped. Это ключевое:
  #      на dev действует fast-lane, и при правках только в md/css тесты там
  #      пропускаются — зелёный workflow тогда ничего не доказывает.
  #   3. В нём job «Deploy to Dev» тоже SUCCESS — то есть код не просто
  #      собрался, а реально доехал и поднялся на dev-сервере.
  #
  # Любое сомнение → тесты гоняются. Молчаливого пропуска быть не должно:
  # упавший прод-деплой оставляет pecado.ru под maintenance.
  check-dev:
    name: "🔍 Проверка dev-прогона"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip_tests: ${{ steps.decide.outputs.skip_tests }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: "🔎 Ищем успешный deploy-dev для этого коммита"
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          emit() {
            echo "skip_tests=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2"     >> "$GITHUB_OUTPUT"
            if [ "$1" = "true" ]; then
              echo "::notice title=Тесты пропущены::$2"
            else
              echo "::notice title=Тесты будут прогнаны::$2"
            fi
            exit 0
          }

          RUN_ID=$(gh api \
            "repos/$REPO/actions/workflows/deploy-dev.yml/runs?head_sha=$SHA&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")

          if [ -z "$RUN_ID" ]; then
            emit false "Завершённого deploy-dev для ${SHA:0:7} нет — прогоняем всё с нуля."
          fi

          RUN_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // "unknown"')
          if [ "$RUN_CONCLUSION" != "success" ]; then
            emit false "deploy-dev #$RUN_ID завершился как '$RUN_CONCLUSION'."
          fi

          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | "\(.name)\t\(.conclusion)"')

          job_result() { printf '%s\n' "$JOBS" | grep -F "$1" | head -1 | cut -f2; }

          TESTS_RESULT=$(job_result "Lint & Tests")
          DEPLOY_RESULT=$(job_result "Deploy to Dev")

          echo "dev run #$RUN_ID: tests='${TESTS_RESULT:-нет}', deploy='${DEPLOY_RESULT:-нет}'"

          if [ "$TESTS_RESULT" != "success" ]; then
            emit false "На dev тесты не прогонялись (job: '${TESTS_RESULT:-отсутствует}') — вероятно, сработал fast-lane."
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            emit false "Деплой на dev не завершился успехом (job: '${DEPLOY_RESULT:-отсутствует}')."
          fi

          emit true "Коммит ${SHA:0:7} уже проверен и задеплоен на dev (прогон #$RUN_ID) — тесты не повторяем."

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Линтинг и тесты
  # ─────────────────────────────────────────────────────────────
  # Гоняются всегда, КРОМЕ случая, когда этот же коммит уже прошёл тесты и
  # успешно задеплоился на dev (см. check-dev выше).
  test:
    name: "🧪 Lint & Tests"
    needs: check-dev
    if: needs.check-dev.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      mysql-prices:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_prices_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - "5672:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, redis, pcntl, sockets
          coverage: none

      - name: "📦 Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "📦 Install PHP dependencies"
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: "⚙️ Prepare .env for tests"
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=sqlite|DB_CONNECTION=mysql|' .env
          cat >> .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=pecado_test
          DB_USERNAME=pecado
          DB_PASSWORD=secret
          DB_PRICES_HOST=127.0.0.1
          DB_PRICES_PORT=3307
          DB_PRICES_DATABASE=pecado_prices_test
          DB_PRICES_USERNAME=pecado
          DB_PRICES_PASSWORD=secret
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=log
          SCOUT_DRIVER=null
          RABBITMQ_HOST=127.0.0.1
          RABBITMQ_PORT=5672
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          EOF
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions
          mkdir -p bootstrap/cache
          php artisan key:generate
          php artisan package:discover --ansi

          # Фейковый Vite manifest, чтобы Blade/Inertia views рендерились в тестах
          mkdir -p public/build
          echo '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.jsx":{"file":"assets/app.js","src":"resources/js/app.jsx","isEntry":true}}' > public/build/manifest.json

      - name: "🗃️ Run migrations"
        run: php artisan migrate --force

      - name: "✅ Run tests"
        run: php artisan test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Сборка фронтенда + AsyncAPI + MkDocs
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: "⚡ Build Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Node dependencies"
        run: npm ci

      - name: "🔍 Lint frontend (undefined components / hooks)"
        run: npm run lint:js

      - name: "🏗️ Build assets"
        run: npm run build

      - name: "📄 Build AsyncAPI docs (validate + bundle + HTML)"
        run: npm run asyncapi:build

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📚 Build MkDocs (ERP guide)"
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: "📚 Build MkDocs (Manual test plan)"
        run: mkdocs build -f mkdocs-testing.yml --strict

      # Передаём сборку в deploy-job через КЭШ, а не artifact storage:
      # у кэша отдельная квота (10 ГБ, LRU) без биллинг-блокировки upload.
      - name: "💾 Cache build output for deploy"
        uses: actions/cache/save@v4
        with:
          key: pecado-prod-build-${{ github.run_id }}
          path: |
            public/build
            docs/asyncapi/html
            docs/asyncapi/pecado-erp-bundled.yaml
            docs-erp/site
            docs-testing/site

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Деплой на Prod-сервер
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: [self-hosted, prod-server]
    needs: [check-dev, test, build-frontend]
    # test может быть намеренно пропущен (коммит уже проверен на dev), а
    # пропущенная зависимость по умолчанию отменяет job. Поэтому условие
    # разбирается вручную: сборка обязана быть успешной, тесты — успешны
    # ЛИБО пропущены осознанно. Любой другой исход (failure, cancelled)
    # прод не выкатывает.
    if: |
      !cancelled() &&
      needs.build-frontend.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    timeout-minutes: 30
    environment:
      name: production
      url: https://pecado.ru

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "💾 Restore build output from cache"
        uses: actions/cache/restore@v4
        with:
          key: pecado-prod-build-${{ github.run_id }}
          path: |
            public/build
            docs/asyncapi/html
            docs/asyncapi/pecado-erp-bundled.yaml
            docs-erp/site
            docs-testing/site
          fail-on-cache-miss: true

      - name: "🔧 Fix Docker file ownership"
        run: |
          # Docker создаёт файлы от root — rsync не может их перезаписать.
          # Возвращаем владельца на runner-юзера через alpine + bind mount.
          CURRENT_UID=$(id -u)
          CURRENT_GID=$(id -g)
          sg docker -c "docker run --rm -v /srv/pecado/public/build:/build alpine chown -R ${CURRENT_UID}:${CURRENT_GID} /build" 2>/dev/null || true

      - name: "🔎 Нужен ли pre-deploy бэкап"
        id: backup_needed
        run: |
          set -uo pipefail
          cd /srv/pecado
          DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          emit() { echo "needed=$1" >> "$GITHUB_OUTPUT"; echo "==> $2"; }

          # Первый деплой: контейнеров нет, дампить нечего.
          if ! sg docker -c "$DC ps --status running --quiet mysql" | grep -q .; then
            emit false "Контейнеры не запущены (первый деплой) — бэкап не нужен"
            exit 0
          fi

          # Аварийный рычаг: [backup] в сообщении коммита форсирует снимок.
          # Нужен, когда релиз сопровождается ручной правкой данных.
          if git -C "$GITHUB_WORKSPACE" log -1 --pretty=%B | grep -qi '\[backup\]'; then
            emit true "Форсировано маркером [backup] в коммите"
            exit 0
          fi

          # Неприменённые миграции. Логика та же, что у `artisan migrate`:
          # basename файла без .php сравнивается с колонкой migrations.migration.
          # Читаем боевую таблицу, а не маркер с SHA: если прошлый деплой упал
          # между rsync и migrate, маркер соврал бы именно в опасном случае.
          APPLIED=$(sg docker -c "$DC exec -T mysql sh -c 'exec mysql -uroot -p\"\$MYSQL_ROOT_PASSWORD\" -N -B -e \"SELECT migration FROM pecado.migrations\"'" 2>/dev/null | sort)
          if [ -z "$APPLIED" ]; then
            emit true "Не удалось прочитать таблицу migrations — бэкапим на всякий случай"
            exit 0
          fi

          FILES=$(ls "$GITHUB_WORKSPACE"/database/migrations/*.php | xargs -n1 basename | sed 's/\.php$//' | sort)
          PENDING=$(comm -23 <(printf '%s\n' "$FILES") <(printf '%s\n' "$APPLIED"))
          if [ -n "$PENDING" ]; then
            echo "Неприменённые миграции:"
            printf '%s\n' "$PENDING" | sed 's/^/  - /'
            emit true "Есть миграции — снимаем бэкап"
            exit 0
          fi

          # Сидеры гоняются на каждом деплое (шаги [5/9] и [5.1/9]) и тоже пишут
          # в БД, поэтому «нет миграций» ещё не значит «БД не изменится».
          # /srv/pecado на этот момент содержит предыдущий релиз — шаг стоит до rsync.
          if ! diff -qr "$GITHUB_WORKSPACE/database/seeders" /srv/pecado/database/seeders >/dev/null 2>&1; then
            emit true "Изменились сидеры — снимаем бэкап"
            exit 0
          fi

          LAST=$(ls -1t /media/backups/mysql/daily/pecado_*.sql.gz 2>/dev/null | head -1)
          echo "::notice title=Pre-deploy бэкап пропущен::Неприменённых миграций и правок сидеров нет. Точка отката — ночной бэкап (${LAST:-/media/backups/mysql/daily}) плюс бинлог (PITR)."
          emit false "Миграций нет — бэкап пропускаем"

      - name: "💾 Pre-deploy backup БД"
        if: steps.backup_needed.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Хранилище — на отдельном диске /dev/sdb (/media), чтобы не забивать системный sda2.
          BACKUP_DIR="/media/backups/mysql/pre-deploy"
          mkdir -p "$BACKUP_DIR"
          DATE=$(date +%Y-%m-%d_%H%M%S)
          cd /srv/pecado
          DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          # pigz ставится на хост руками (CI пакеты не ставит), поэтому мягкая деградация.
          # -p 4, а не все ядра: раннер живёт на боевом сервере, который отдаёт трафик.
          if command -v pigz >/dev/null 2>&1; then GZ="pigz -p 4"; else GZ="gzip"; fi

          # Флаги держим в согласии со scripts/prod-backup-db.sh:
          #   --single-transaction — консистентный снимок без LOCK TABLES. Без него
          #     mysqldump блокировал запись на живом проде на всё время дампа,
          #     а maintenance включается только ниже, на шаге Deploy.
          #   --quick — не буферизовать таблицу целиком в память.
          #   --no-tablespaces — не требовать привилегию PROCESS.
          OPTS="--single-transaction --quick --no-tablespaces"

          # Таблицы, чьи ДАННЫЕ в снимке не нужны. Их DDL уезжает первым проходом,
          # поэтому после восстановления приложение не падает на запросах к ним.
          # erp_bus_messages и erp_processed_messages оставляем с данными осознанно:
          # после restore они нужны, чтобы 1С не переобработала переотправленное.
          IGNORE=""
          for t in telescope_entries telescope_entries_tags telescope_monitoring cache cache_locks jobs job_batches; do
            IGNORE="$IGNORE --ignore-table=pecado.$t"
          done

          echo "==> Backup main DB..."
          # Два прохода в один gzip-поток (схема обкатана в scripts/db-pull.sh):
          # структура всех таблиц + данные без мусора. Склейка остаётся валидным
          # SQL-скриптом, поэтому восстановление по-прежнему делается одной командой:
          #   gunzip < pecado_<дата>.sql.gz | mysql pecado
          # --source-data=2 пишет координаты бинлога в шапку — снимок годится как
          # точка отсчёта для PITR, как в ночном бэкапе.
          {
            sg docker -c "$DC exec -T mysql sh -c 'exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" $OPTS --source-data=2 --no-data --routines --triggers pecado'"
            sg docker -c "$DC exec -T mysql sh -c 'exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" $OPTS --no-create-info $IGNORE pecado'"
          } | $GZ > "$BACKUP_DIR/pecado_${DATE}.sql.gz"

          echo "==> Backup prices DB..."
          # Целиком: individual_prices восстанавливается из 1С часами, экономить
          # на ней точку отката нельзя. Бинлог у этой БД отключён (skip-log-bin),
          # поэтому без --source-data.
          sg docker -c "$DC exec -T mysql-prices sh -c 'exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" $OPTS pecado_prices'" \
            | $GZ > "$BACKUP_DIR/pecado_prices_${DATE}.sql.gz"

          # Битый архив хуже отсутствующего — проверяем оба.
          echo "==> Проверка целостности архивов..."
          gzip -t "$BACKUP_DIR/pecado_${DATE}.sql.gz"
          gzip -t "$BACKUP_DIR/pecado_prices_${DATE}.sql.gz"

          # Retention основной БД: оставляем 10 последних
          echo "==> Rotation main DB (keep last 10)..."
          ls -1t "$BACKUP_DIR"/pecado_*.sql.gz 2>/dev/null | grep -v '/pecado_prices_' | tail -n +11 | xargs -r rm -fv

          # Retention БД цен: оставляем только 5 последних — таблицы цен большие,
          # архивы могут забить диск даже сжатыми.
          echo "==> Rotation prices DB (keep last 5)..."
          ls -1t "$BACKUP_DIR"/pecado_prices_*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -fv

          echo "==> Pre-deploy backup OK: ${DATE}"
          ls -lh "$BACKUP_DIR/pecado_${DATE}.sql.gz" "$BACKUP_DIR/pecado_prices_${DATE}.sql.gz"
          df -h /media | tail -1

      - name: "📤 Sync code to /srv/pecado"
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='/vendor' \
            --exclude='node_modules' \
            --exclude='bootstrap/cache' \
            --exclude='public/hot' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/app/exports' \
            --exclude='storage/app/public' \
            ./ /srv/pecado/

      - name: "🐳 Deploy"
        run: |
          set -euo pipefail
          cd /srv/pecado
          DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          echo "==> [0.0/9] Флаг экспорта кабинета (CSV/XLSX)..."
          if ! grep -q "CABINET_SEARCH_EXPORT" /srv/pecado/.env; then
            echo "CABINET_SEARCH_EXPORT=true" >> /srv/pecado/.env
          fi

          echo "==> [0.1/9] Флаг выдачи промо-позиций по акциям..."
          # config/promotions.php читает именно PROMO_ISSUE_ENABLED;
          # PROMOTIONS_ISSUE_ENABLED — опечатка предыдущего релиза, вычищаем
          sed -i '/^PROMOTIONS_ISSUE_ENABLED=/d' /srv/pecado/.env
          if ! grep -q "^PROMO_ISSUE_ENABLED" /srv/pecado/.env; then
            echo "PROMO_ISSUE_ENABLED=true" >> /srv/pecado/.env
          fi

          echo "==> [0.2/9] Флаг организаций (графа «Продавец» в документах)..."
          # config/erp.php → erp.organizations.enabled. Гейтит только показ
          # организации в админке/ЛК/CRM; приём из 1С работает всегда.
          if grep -q "^ORGANIZATIONS_ENABLED=" /srv/pecado/.env; then
            sed -i 's|^ORGANIZATIONS_ENABLED=.*|ORGANIZATIONS_ENABLED=true|' /srv/pecado/.env
          else
            echo "ORGANIZATIONS_ENABLED=true" >> /srv/pecado/.env
          fi

          echo "==> [0.3/9] Флаг отправки предзаказов поставщику (sex-opt.ru)..."
          # config/services.php → services.sex_opt.preorder.enabled. Мастер-выключатель:
          # гейтит и автоотправку при создании предзаказа, и кнопку «Отправить повторно».
          # ВРЕМЕННО выключено — чтобы включить обратно, поменяй false на true в обеих строках.
          if grep -q "^SUPPLIER_PREORDER_ENABLED=" /srv/pecado/.env; then
            sed -i 's|^SUPPLIER_PREORDER_ENABLED=.*|SUPPLIER_PREORDER_ENABLED=false|' /srv/pecado/.env
          else
            echo "SUPPLIER_PREORDER_ENABLED=false" >> /srv/pecado/.env
          fi

          echo "==> [0.35/9] Деньги в кабинете клиента..."
          # config/cabinet.php → cabinet.finance_enabled (видимость денег клиенту).
          #
          # SETTLEMENTS_LEDGER_ENABLED отсюда снят вместе со старым счётным ядром
          # (fin-11): выбирать больше не из чего — долг, просрочка и акт сверки
          # считаются регистром 1С всегда. Рубильник кабинета остаётся: им гасят
          # раздел, если данные из 1С окажутся недостоверными.
          for pair in "CABINET_FINANCE_ENABLED=true"; do
            key="${pair%%=*}"
            if grep -q "^${key}=" /srv/pecado/.env; then
              sed -i "s|^${key}=.*|${pair}|" /srv/pecado/.env
            else
              echo "${pair}" >> /srv/pecado/.env
            fi
          done


          # Пульт уведомлений демонтирован (mail-10): переменные больше ни на что
          # не влияют и только путают того, кто читает .env.
          sed -i '/^NOTIFICATION_PULSE_/d; /^PULSE_DOMAIN_/d' /srv/pecado/.env

          echo "==> [0.5/9] Поток писем: сборка писем по поводам..."
          # Эпик note-00: кому уйдёт уведомление, решает матрица настроек
          # партнёра — в его карточке и у него в кабинете.
          #
          # MAIL_NOTIFICATIONS_LIVE — рубильник этой маршрутизации.
          # MAIL_STREAM_AUTOSEND — общий рубильник отправки. Нужны оба: первый
          # отвечает «доверяем ли новой машинерии», второй — «отправляем ли
          # вообще». Смешать их значило бы, что включение одного тихо включает
          # другое.
          #
          # Клиентские уведомления при этом выключены умолчанием в
          # config/mail_occasions.php — решение заказчика: сначала тишина,
          # потом настройка каждому партнёру индивидуально.
          #
          # Зашитые рассылки клиентам гасятся здесь же. Иначе «отключить
          # получение писем» не работает: матрица молчит, а листенеры шлют мимо
          # неё. MAIL_FEATURE_MANAGER_ORDER остаётся включённым — это письмо
          # сотруднику, и ослеплять отдел продаж не просили.
          #
          # Значения задаются жёстко, а не «дописать, если нет»: иначе однажды
          # выставленное на сервере руками переживало бы любой релиз, и файл
          # в репозитории перестал бы отвечать на вопрос «что включено на проде».
          for pair in \
            "MAIL_STREAM_ENABLED=true" \
            "MAIL_STREAM_ORDERS=true" \
            "MAIL_STREAM_DOCUMENTS=true" \
            "MAIL_STREAM_FINANCE=true" \
            "MAIL_STREAM_AUTOSEND=true" \
            "MAIL_NOTIFICATIONS_LIVE=true" \
            "DEBT_CONTROL_LIVE_ACTIONS=mail,gate,tasks,cabinet" \
            "MAIL_FEATURE_ORDER_CREATED=false" \
            "MAIL_FEATURE_ORDER_STATUS=false" \
            "MAIL_FEATURE_RETURN_CREATED=false" \
            "MAIL_FEATURE_RETURN_STATUS=false" \
            "MAIL_FEATURE_ENTITY_SUBSCRIPTIONS=false" \
          ; do
            key="${pair%%=*}"
            if grep -q "^${key}=" /srv/pecado/.env; then
              sed -i "s|^${key}=.*|${pair}|" /srv/pecado/.env
            else
              echo "${pair}" >> /srv/pecado/.env
            fi
          done

          echo "==> [0.4/9] Адресаты писем, у которых нет владельца в данных..."
          # Письмо о заказе уходит персональному менеджеру клиента; этот адрес —
          # только для клиентов, у которых менеджера нет. Вопросы с /faq адресатов
          # в данных не имеют вовсе, поэтому им нужен явный список.
          # Значение здесь — источник правды: править на сервере руками нельзя,
          # деплой всё равно перезапишет. Меняется в этом файле и уезжает через CI.
          for pair in "MAIL_ORDER_FALLBACK_RECIPIENTS=sales@pecado.ru" "MAIL_USER_QUESTION_RECIPIENTS=sales@pecado.ru"; do
            key="${pair%%=*}"
            if grep -q "^${key}=" /srv/pecado/.env; then
              sed -i "s|^${key}=.*|${pair}|" /srv/pecado/.env
            else
              echo "${pair}" >> /srv/pecado/.env
            fi
          done

          echo "==> [0/9] Maintenance mode ON..."
          sg docker -c "$DC exec -T app php artisan down --retry=30 --refresh=5" || true

          echo "==> [1/9] Установка PHP зависимостей..."
          # Кеш пакетов не попадает под rsync и остаётся от прошлого релиза. Если
          # релиз удаляет пакет, `composer install` бутит приложение через
          # package:discover и падает на провайдере, которого уже нет в vendor, —
          # прод остаётся под maintenance. Сносим кеш заранее, он всё равно
          # пересобирается ниже на config:cache.
          rm -f /srv/pecado/bootstrap/cache/packages.php /srv/pecado/bootstrap/cache/services.php
          sg docker -c "$DC exec -T app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative"

          echo "==> [1.5/9] Создание symlink public/storage (если ещё нет)..."
          sg docker -c "$DC exec -T app php artisan storage:link" || true

          echo "==> [2/9] Очистка и прогрев кешей Laravel..."
          sg docker -c "$DC exec -T app php artisan optimize:clear"
          sg docker -c "$DC exec -T app php artisan config:cache"
          sg docker -c "$DC exec -T app php artisan route:cache"
          sg docker -c "$DC exec -T app php artisan view:cache"
          sg docker -c "$DC exec -T app php artisan event:cache"
          sg docker -c "$DC exec -T app php artisan optimize"

          echo "==> [3/9] Запуск и ожидание prices DB..."
          sg docker -c "$DC up -d mysql-prices"
          for i in $(seq 1 30); do
            STATUS=$(sg docker -c "docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' pecado-mysql-prices" 2>/dev/null || echo "missing")
            [ "$STATUS" = "healthy" ] && { echo "prices DB готова"; break; }
            [ "$i" -eq 30 ] && { echo "❌ mysql-prices не перешёл в healthy: $STATUS"; sg docker -c 'docker logs --tail 100 pecado-mysql-prices' || true; exit 1; }
            echo "Ожидание mysql-prices: $STATUS ($i/30)"
            sleep 2
          done

          echo "==> [4/9] Миграции (main DB + prices DB)..."
          sg docker -c "$DC exec -T app php artisan migrate --force"

          echo "==> [4.1/9] Права read-only пользователя BI/ИИ-агента..."
          # Сразу после миграций: новая таблица без GRANT SELECT невидима для
          # аналитического MCP, и это обнаруживается не сразу, а когда менеджер
          # не находит данные в отчёте. Раньше шаг делался руками и потому забывался.
          #
          # Команда только печатает SQL (у пользователя приложения нет GRANT OPTION),
          # применяет его root изнутри контейнера mysql — так же, как шаг бэкапа выше.
          # Идемпотентно: вывод начинается с REVOKE ALL и заново выдаёт весь набор.
          #
          # Пользователя SQL не создаёт, поэтому на базе без bi_agent REVOKE упал бы
          # и уронил весь деплой. Аналитический агент — не критичная часть релиза,
          # так что при отсутствии пользователя шаг пропускается с предупреждением.
          # Запрос идёт через stdin, а не через -e: внутри двойных кавычек sg docker -c
          # одинарную кавычку не заэкранировать, а SQL-литерал без неё не написать.
          BI_USER_EXISTS=$(echo "SELECT COUNT(*) FROM mysql.user WHERE user='bi_agent';" \
            | sg docker -c "$DC exec -T mysql sh -c 'exec mysql -uroot -p\"\$MYSQL_ROOT_PASSWORD\" -N -B'" 2>/dev/null \
            | tr -d '[:space:]')

          if [ "$BI_USER_EXISTS" = "0" ] || [ -z "$BI_USER_EXISTS" ]; then
            echo "::warning::bi_agent не заведён в MySQL — синхронизация прав пропущена"
          else
            sg docker -c "$DC exec -T app php artisan bi:sync-grants --connection=mysql" > /tmp/bi-grants.sql
            sg docker -c "$DC exec -T mysql sh -c 'exec mysql -uroot -p\"\$MYSQL_ROOT_PASSWORD\"'" < /tmp/bi-grants.sql
            rm -f /tmp/bi-grants.sql
            echo "Права bi_agent синхронизированы со схемой"
          fi

          echo "==> [5/9] Синхронизация ролей и прав..."
          sg docker -c "$DC exec -T app php artisan db:seed --class=RolesAndPermissionsSeeder --force"

          echo "==> [5.2/9] Лестница долга: ступени по регистру..."
          # Письма клиентам включены 29.08.2026 (решение заказчика): уходят только
          # на переходах ступени, под разблокировкой молчат. Первый пересчёт после
          # включения письма о текущих ступенях не шлёт — переходов нет.
          # debt-00 v2: ступень ставится сразу по замеру, пересчёт идемпотентен.
          # При деплое — чтобы состояние появилось сразу, а не в 07:10 следующего дня.
          # Ошибка пересчёта релиз не роняет: ночной запуск повторит.
          # Гевея (id 675): по решению заказчика 28.08 лестница к ней не применяется —
          # разблокировка ставится до первого пересчёта, один раз (--if-never);
          # дальше продлевает менеджер в CRM, как всем.
          sg docker -c "$DC exec -T app php artisan debt:pause 675 --days=30 --if-never --reason='Решение руководства 28.08.2026: работаем по договорённости менеджера, лестница долга не применяется до продления'" || echo "::warning::debt:pause для Гевеи не выполнился — поставьте разблокировку в CRM вручную"
          sg docker -c "$DC exec -T app php artisan debt:recalculate" || echo "::warning::debt:recalculate завершился с ошибкой — проверьте после релиза"
          # Кто уже на ступени, но письма о ней не получал (ступень посчитана до
          # включения писем) — дослать один раз; повторные запуски ничего не шлют.
          sg docker -c "$DC exec -T app php artisan debt:notify-current" || echo "::warning::debt:notify-current завершился с ошибкой"
          # Строки регистра без document_id (стартовая загрузка 13.08 и всё до релиза
          # линковки 25.08) — без связи в календаре оплат нет ссылки «Открыть».
          # Идемпотентно, трогает только строки без связи.
          sg docker -c "$DC exec -T app php artisan settlements:relink-documents" || echo "::warning::settlements:relink-documents завершился с ошибкой — запустите руками после релиза"

          echo "==> [5.1/9] Юридические страницы и пункты меню (идемпотентно)..."
          sg docker -c "$DC exec -T app php artisan db:seed --class=LegalPagesSeeder --force"

          echo "==> [6/9] RabbitMQ users + topology..."
          sg docker -c "$DC up -d rabbitmq"
          for i in $(seq 1 30); do
            sg docker -c "$DC exec -T rabbitmq rabbitmq-diagnostics ping" >/dev/null 2>&1 && { echo "RabbitMQ готов"; break; }
            [ "$i" -eq 30 ] && { echo "❌ RabbitMQ не поднялся"; sg docker -c 'docker logs --tail 100 pecado-rabbitmq' || true; exit 1; }
            sleep 2
          done

          # Provisioning пользователей RabbitMQ из /srv/pecado/.env
          set -a
          source /srv/pecado/.env
          set +a
          ensure_user() {
            local user="$1" pass="$2" tag="$3" conf="$4" write="$5" read="$6"
            if sg docker -c "$DC exec -T rabbitmq rabbitmqctl list_users" 2>/dev/null | awk '{print $1}' | grep -Fxq "$user"; then
              echo "  пользователь $user уже есть — обновляю пароль/права"
              sg docker -c "$DC exec -T rabbitmq rabbitmqctl change_password '$user' '$pass'"
            else
              echo "  создаю пользователя $user"
              sg docker -c "$DC exec -T rabbitmq rabbitmqctl add_user '$user' '$pass'"
            fi
            [ -n "$tag" ] && sg docker -c "$DC exec -T rabbitmq rabbitmqctl set_user_tags '$user' $tag"
            sg docker -c "$DC exec -T rabbitmq rabbitmqctl set_permissions -p / '$user' '$conf' '$write' '$read'"
          }
          ensure_user "${RABBITMQ_MANAGEMENT_USER}" "${RABBITMQ_MANAGEMENT_PASSWORD}" "administrator" ".*" ".*" ".*"
          ensure_user "${RABBITMQ_USER}"            "${RABBITMQ_PASSWORD}"            ""               ".*" ".*" ".*"
          if [ -n "${RABBITMQ_ERP_USER:-}" ] && [ -n "${RABBITMQ_ERP_PASSWORD:-}" ]; then
            ensure_user "${RABBITMQ_ERP_USER}"      "${RABBITMQ_ERP_PASSWORD}"        "" 'erp\..*|erp_out\..*|external\..*' 'erp\..*' 'erp_out\..*|external\..*'
          fi
          # Удаляем дефолтного guest для безопасности
          sg docker -c "$DC exec -T rabbitmq rabbitmqctl delete_user guest" 2>/dev/null || true

          # Топология (exchanges, queues, shovels)
          sg docker -c "$DC exec -T app php artisan rabbitmq:setup" || true

          echo "==> [7/9] Meilisearch settings + synonyms..."
          sg docker -c "$DC exec -T app php artisan scout:sync-index-settings" || true
          sg docker -c "$DC exec -T app php artisan meilisearch:sync-synonyms" || true

          # Приватный бакет для сканов договоров + перенос ранее загруженных с публичного диска
          sg docker -c "$DC exec -T app php artisan crm:contracts-private-storage" || true

          echo "==> [8/9] Применение compose-конфигурации и рестарт..."
          # up -d пересоздаёт ровно те сервисы, у которых изменились порты/env/volumes
          # (mysql, redis, meilisearch, minio и пр., которые иначе нигде не trogаются).
          # Сервисы под profiles=["dev"] (mailpit, node, createbuckets) не поднимаются.
          sg docker -c "$DC up -d --remove-orphans"
          sg docker -c "$DC exec -T app php artisan queue:restart"
          # restart нужен даже после up -d: app/worker монтируют код через bind mount,
          # PHP-FPM/queue процессы должны быть перезапущены для подхвата свежего vendor/.
          sg docker -c "$DC restart app worker nginx"

          echo "==> [9/9] Maintenance mode OFF..."
          sg docker -c "$DC exec -T app php artisan up"

          echo ""
          echo "✅ Production деплой завершён!"

      - name: "🏥 Health Check"
        run: |
          sleep 5
          # Идём на 127.0.0.1 с Host:pecado.ru — обходим hairpin NAT (с самого
          # prod-сервера запрос на свой внешний IP не возвращается).
          # SNI выставляется через --resolve, поэтому SSL/HSTS-флоу проверяется
          # ровно тот же, что у внешних клиентов.
          HTTPS_CODE=$(curl -sk --resolve pecado.ru:443:127.0.0.1 -o /dev/null -w "%{http_code}" -m 10 https://pecado.ru/up 2>/dev/null || echo "000")
          HTTP_REDIRECT=$(curl -s --resolve pecado.ru:80:127.0.0.1 -o /dev/null -w "%{http_code}" -m 5 http://pecado.ru/up 2>/dev/null || echo "000")
          echo "https://pecado.ru/up via loopback: $HTTPS_CODE"
          echo "http://pecado.ru/up via loopback (ожидаем 301): $HTTP_REDIRECT"
          if [ "$HTTPS_CODE" = "200" ]; then
            echo "✅ Health check passed (HTTPS $HTTPS_CODE)"
          else
            echo "❌ Health check FAILED (HTTPS $HTTPS_CODE)"
            # Поднимаем сайт из maintenance, если он там завис
            docker compose -f /srv/pecado/docker-compose.yml -f /srv/pecado/docker-compose.prod.yml exec -T app php artisan up || true
            docker compose -f /srv/pecado/docker-compose.yml -f /srv/pecado/docker-compose.prod.yml logs --tail=50 nginx app || true
            exit 1
          fi

      - name: "📢 Notify on success"
        if: success()
        run: |
          echo "✅ Prod deploy successful!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
          # TODO: Telegram/Slack notification

      - name: "🔔 Notify on failure"
        if: failure()
        run: |
          echo "❌ Prod deploy FAILED!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
          # TODO: Telegram/Slack notification — на проде это критично!
