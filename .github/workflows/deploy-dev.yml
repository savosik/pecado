name: Deploy to Dev

on:
  push:
    branches:
      - dev

# Отменяем предыдущий деплой при новом пуше в ту же ветку
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Линтинг и тесты
  # ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Lint & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - "5672:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, redis, pcntl, sockets
          coverage: none

      - name: "📦 Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "📦 Install PHP dependencies"
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: "⚙️ Prepare .env for tests"
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=sqlite|DB_CONNECTION=mysql|' .env
          cat >> .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=pecado_test
          DB_USERNAME=pecado
          DB_PASSWORD=secret
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=log
          SCOUT_DRIVER=null
          RABBITMQ_HOST=127.0.0.1
          RABBITMQ_PORT=5672
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          EOF
          php artisan key:generate
          # Создаём необходимые директории storage
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions
          mkdir -p bootstrap/cache

          # Создаём фейковый Vite manifest чтобы тесты могли рендерить Blade/Inertia views
          mkdir -p public/build
          echo '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.jsx":{"file":"assets/app.js","src":"resources/js/app.jsx","isEntry":true}}' > public/build/manifest.json

      - name: "🗃️ Run migrations"
        run: php artisan migrate --force

      - name: "✅ Run tests"
        run: php artisan test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Сборка фронтенда
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: "⚡ Build Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Node dependencies"
        run: npm ci

      - name: "🏗️ Build assets"
        run: npm run build

      - name: "📄 Generate AsyncAPI HTML docs"
        run: npm run asyncapi:html

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

      - name: "📤 Upload AsyncAPI docs"
        uses: actions/upload-artifact@v4
        with:
          name: asyncapi-docs
          path: docs/asyncapi/html
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Деплой на Dev-сервер
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Dev"
    runs-on: [self-hosted, dev-server]
    needs: [test, build-frontend]
    timeout-minutes: 20
    environment: dev

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Download frontend build"
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: "📥 Download AsyncAPI docs"
        uses: actions/download-artifact@v4
        with:
          name: asyncapi-docs
          path: docs/asyncapi/html

      - name: "🔧 Fix Docker file ownership"
        run: |
          # Docker создаёт файлы от root — rsync не может их перезаписать
          # Используем docker run для chown на хостовой FS через bind mount
          CURRENT_UID=$(id -u)
          CURRENT_GID=$(id -g)
          sg docker -c "docker run --rm -v /srv/pecado/public/build:/build alpine chown -R ${CURRENT_UID}:${CURRENT_GID} /build" 2>/dev/null || true

      - name: "📤 Sync code to production dir"
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='bootstrap/cache' \
            --exclude='public/hot' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            ./ /srv/pecado/

      - name: "🐳 Deploy"
        run: |
          set -euo pipefail
          cd /srv/pecado

          echo "==> [1/7] Установка PHP зависимостей..."
          sg docker -c 'docker compose exec -T app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader'

          echo "==> [2/7] Очистка и прогрев кешей Laravel..."
          sg docker -c 'docker compose exec -T app php artisan optimize:clear'
          sg docker -c 'docker compose exec -T app php artisan config:cache'
          sg docker -c 'docker compose exec -T app php artisan route:cache'
          sg docker -c 'docker compose exec -T app php artisan view:cache'
          sg docker -c 'docker compose exec -T app php artisan optimize'

          echo "==> [3/7] Выполнение миграций..."
          sg docker -c 'docker compose exec -T app php artisan migrate --force'

          echo "==> [4/7] Синхронизация ролей и прав..."
          sg docker -c 'docker compose exec -T app php artisan db:seed --class=RolesAndPermissionsSeeder --force'

          echo "==> [5/7] Настройка топологии RabbitMQ..."
          sg docker -c 'docker compose exec -T app php artisan rabbitmq:setup' || true

          echo "==> [6/7] Перезапуск очередей..."
          sg docker -c 'docker compose exec -T app php artisan queue:restart'

          echo "==> [7/7] Перезагрузка PHP-FPM, workers и nginx..."
          sg docker -c 'docker compose restart app worker nginx'

          echo ""
          echo "✅ Деплой завершён успешно!"

      - name: "🏥 Health Check"
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/up)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check прошёл (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check не прошёл (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: "📢 Notify on success"
        if: success()
        run: |
          echo "✅ Деплой ветки dev выполнен успешно!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"

      - name: "🔔 Notify on failure"
        if: failure()
        run: |
          echo "❌ Деплой завершился с ошибкой!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
