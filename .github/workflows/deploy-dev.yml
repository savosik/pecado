name: Deploy to Dev

on:
  push:
    branches:
      - dev

# Отменяем предыдущий деплой при новом пуше в ту же ветку
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 0: Решение о fast-lane (пропуск тестов)
  # ─────────────────────────────────────────────────────────────
  # Тесты пропускаются если:
  #   1) commit message содержит [fast] или [skip-tests]
  #   2) изменения только в "безопасных" путях (md/css/docs/задачи)
  # Любое касание PHP/JS/конфигов/миграций/composer/package/CI =>
  # полный прогон.
  changes:
    name: "🔍 Decide fast-lane"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip_tests: ${{ steps.decide.outputs.skip_tests }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "🗂️ Filter changed paths"
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.css'
              - '!**/*.scss'
              - '!resources/css/**'
              - '!docs-erp/**'
              - '!docs-testing/**'
              - '!docs/tasks/**'
              - '!.editorconfig'
              - '!.gitignore'
              - '!.gitattributes'

      - name: "🚦 Decide"
        id: decide
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
        run: |
          set -euo pipefail
          if printf '%s' "$COMMIT_MSG" | grep -qE '\[fast\]|\[skip-tests\]'; then
            SKIP=true
            REASON='commit message содержит [fast] / [skip-tests]'
          elif [ "$CODE_CHANGED" = "false" ]; then
            SKIP=true
            REASON='изменения только в безопасных путях (md/css/docs)'
          else
            SKIP=false
            REASON='обнаружены изменения в коде — гоняем полный test suite'
          fi
          echo "skip_tests=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          {
            echo "## 🚦 Fast-lane decision"
            echo ""
            echo "- **Skip tests:** \`$SKIP\`"
            echo "- **Reason:** $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Линтинг и тесты
  # ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Lint & Tests"
    needs: changes
    if: needs.changes.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      mysql-prices:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pecado_prices_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: pecado
          MYSQL_PASSWORD: secret
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=40s

      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - "5672:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, redis, pcntl, sockets
          coverage: none

      - name: "📦 Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "📦 Install PHP dependencies"
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: "⚙️ Prepare .env for tests"
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=sqlite|DB_CONNECTION=mysql|' .env
          cat >> .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=pecado_test
          DB_USERNAME=pecado
          DB_PASSWORD=secret
          DB_PRICES_HOST=127.0.0.1
          DB_PRICES_PORT=3307
          DB_PRICES_DATABASE=pecado_prices_test
          DB_PRICES_USERNAME=pecado
          DB_PRICES_PASSWORD=secret
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=log
          SCOUT_DRIVER=null
          RABBITMQ_HOST=127.0.0.1
          RABBITMQ_PORT=5672
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          EOF
          # Создаём необходимые директории storage до первого вызова artisan
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions
          mkdir -p bootstrap/cache
          php artisan key:generate
          # Регистрируем пакеты (после создания storage и .env)
          php artisan package:discover --ansi

          # Создаём фейковый Vite manifest чтобы тесты могли рендерить Blade/Inertia views
          mkdir -p public/build
          echo '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.jsx":{"file":"assets/app.js","src":"resources/js/app.jsx","isEntry":true}}' > public/build/manifest.json

      - name: "🗃️ Run migrations"
        run: php artisan migrate --force

      - name: "✅ Run tests"
        run: php artisan test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Сборка фронтенда
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: "⚡ Build Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Node dependencies"
        run: npm ci

      - name: "🔍 Lint frontend (undefined components / hooks)"
        run: npm run lint:js

      - name: "🏗️ Build assets"
        run: npm run build

      - name: "📄 Build AsyncAPI docs (validate + bundle + HTML)"
        run: npm run asyncapi:build

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📚 Build MkDocs (ERP guide)"
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: "📚 Build MkDocs (Manual test plan)"
        run: mkdocs build -f mkdocs-testing.yml --strict

      # Передаём сборку в deploy-job через КЭШ, а не artifact storage:
      # у кэша отдельная квота (10 ГБ, LRU) без биллинг-блокировки upload.
      - name: "💾 Cache build output for deploy"
        uses: actions/cache/save@v4
        with:
          key: pecado-dev-build-${{ github.run_id }}
          path: |
            public/build
            docs/asyncapi/html
            docs/asyncapi/pecado-erp-bundled.yaml
            docs-erp/site
            docs-testing/site

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Деплой на Dev-сервер
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Dev"
    runs-on: [self-hosted, dev-server]
    needs: [test, build-frontend]
    if: |
      always() &&
      needs.build-frontend.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    timeout-minutes: 20
    environment: dev

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "💾 Restore build output from cache"
        uses: actions/cache/restore@v4
        with:
          key: pecado-dev-build-${{ github.run_id }}
          path: |
            public/build
            docs/asyncapi/html
            docs/asyncapi/pecado-erp-bundled.yaml
            docs-erp/site
            docs-testing/site
          fail-on-cache-miss: true

      - name: "🔧 Fix Docker file ownership"
        run: |
          # Docker создаёт файлы от root — rsync не может их перезаписать
          # Используем docker run для chown на хостовой FS через bind mount
          CURRENT_UID=$(id -u)
          CURRENT_GID=$(id -g)
          sg docker -c "docker run --rm -v /srv/pecado/public/build:/build alpine chown -R ${CURRENT_UID}:${CURRENT_GID} /build" 2>/dev/null || true

      - name: "📤 Sync code to production dir"
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='/vendor' \
            --exclude='node_modules' \
            --exclude='bootstrap/cache' \
            --exclude='public/hot' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/app/exports' \
            --exclude='storage/app/public' \
            ./ /srv/pecado/

      - name: "🐳 Deploy"
        run: |
          set -euo pipefail
          cd /srv/pecado

          echo "==> [0/7] Настройка переменных prices DB..."
          if ! grep -q "DB_PRICES_HOST" /srv/pecado/.env; then
            {
              echo ""
              echo "# Individual Prices Database (отдельный контейнер)"
              echo "DB_PRICES_HOST=mysql-prices"
              echo "DB_PRICES_PORT=3306"
              echo "DB_PRICES_DATABASE=pecado_prices"
              echo "DB_PRICES_USERNAME=pecado"
              echo "DB_PRICES_PASSWORD=secret"
            } >> /srv/pecado/.env
          fi

          echo "==> [0.5/7] Флаг экспорта кабинета (CSV/XLSX)..."
          if ! grep -q "CABINET_SEARCH_EXPORT" /srv/pecado/.env; then
            echo "CABINET_SEARCH_EXPORT=true" >> /srv/pecado/.env
          fi

          # Выдача промо-позиций. На dev включена: здесь обкатываются акции
          # конструктора. На prod флаг не трогаем — там выдачу включают вручную.
          echo "==> [0.6/7] Флаг выдачи промо-позиций..."
          if ! grep -q "PROMO_ISSUE_ENABLED" /srv/pecado/.env; then
            echo "PROMO_ISSUE_ENABLED=true" >> /srv/pecado/.env
          fi

          echo "==> [0.7/7] Флаг организаций (графа «Продавец» в документах)..."
          # config/erp.php → erp.organizations.enabled. Гейтит только показ
          # организации в админке/ЛК/CRM; приём из 1С работает всегда.
          if grep -q "^ORGANIZATIONS_ENABLED=" /srv/pecado/.env; then
            sed -i 's|^ORGANIZATIONS_ENABLED=.*|ORGANIZATIONS_ENABLED=true|' /srv/pecado/.env
          else
            echo "ORGANIZATIONS_ENABLED=true" >> /srv/pecado/.env
          fi

          echo "==> [1/7] Установка PHP зависимостей..."
          # См. комментарий в deploy-prod.yml: кеш пакетов от прошлого релиза
          # роняет composer install, если релиз удаляет пакет.
          rm -f /srv/pecado/bootstrap/cache/packages.php /srv/pecado/bootstrap/cache/services.php
          sg docker -c 'docker compose exec -T app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader'

          echo "==> [1.5/7] Создание symlink public/storage (если ещё нет)..."
          sg docker -c 'docker compose exec -T app php artisan storage:link' || true

          echo "==> [2/7] Очистка и прогрев кешей Laravel..."
          sg docker -c 'docker compose exec -T app php artisan optimize:clear'
          sg docker -c 'docker compose exec -T app php artisan config:cache'
          sg docker -c 'docker compose exec -T app php artisan route:cache'
          sg docker -c 'docker compose exec -T app php artisan view:cache'
          sg docker -c 'docker compose exec -T app php artisan optimize'

          echo "==> [2.5/7] Запуск prices DB контейнера..."
          sg docker -c 'docker compose up -d mysql-prices'

          echo "==> [2.6/7] Ожидание готовности prices DB..."
          for i in $(seq 1 30); do
            STATUS=$(sg docker -c "docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' pecado-mysql-prices" 2>/dev/null || echo "missing")

            if [ "$STATUS" = "healthy" ]; then
              echo "prices DB готова"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "❌ mysql-prices не перешёл в healthy. Текущий статус: $STATUS"
              sg docker -c 'docker logs --tail 100 pecado-mysql-prices' || true
              exit 1
            fi

            echo "Ожидание mysql-prices: статус $STATUS ($i/30)"
            sleep 2
          done

          echo "==> [3/7] Выполнение миграций (main DB + prices DB)..."
          sg docker -c 'docker compose exec -T app php artisan migrate --force'

          echo "==> [4/7] Синхронизация ролей и прав..."
          sg docker -c 'docker compose exec -T app php artisan db:seed --class=RolesAndPermissionsSeeder --force'

          echo "==> [4.1/7] Юридические страницы и пункты меню (идемпотентно)..."
          sg docker -c 'docker compose exec -T app php artisan db:seed --class=LegalPagesSeeder --force'

          echo "==> [5/7] Применение актуальной конфигурации RabbitMQ (плагины shovel, persistent volume)..."
          sg docker -c 'docker compose up -d rabbitmq'

          echo "==> [5.1/7] Ожидание готовности RabbitMQ..."
          for i in $(seq 1 30); do
            if sg docker -c 'docker compose exec -T rabbitmq rabbitmq-diagnostics ping' >/dev/null 2>&1; then
              echo "RabbitMQ готов"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ RabbitMQ не поднялся"
              sg docker -c 'docker logs --tail 100 pecado-rabbitmq' || true
              exit 1
            fi
            sleep 2
          done

          echo "==> [5.2/7] Провижининг пользователей RabbitMQ (идемпотентно)..."
          # Пароли берём из /srv/pecado/.env — чтобы при любом recreate контейнера
          # (например при подключении нового persistent volume) пользователи создавались заново.
          set -a
          source /srv/pecado/.env
          set +a
          ensure_user() {
            local user="$1" pass="$2" tag="$3" conf="$4" write="$5" read="$6"
            if sg docker -c "docker compose exec -T rabbitmq rabbitmqctl list_users" 2>/dev/null | awk '{print $1}' | grep -Fxq "$user"; then
              echo "  пользователь $user уже есть — обновляю пароль/права"
              sg docker -c "docker compose exec -T rabbitmq rabbitmqctl change_password '$user' '$pass'"
            else
              echo "  создаю пользователя $user"
              sg docker -c "docker compose exec -T rabbitmq rabbitmqctl add_user '$user' '$pass'"
            fi
            if [ -n "$tag" ]; then
              sg docker -c "docker compose exec -T rabbitmq rabbitmqctl set_user_tags '$user' $tag"
            fi
            sg docker -c "docker compose exec -T rabbitmq rabbitmqctl set_permissions -p / '$user' '$conf' '$write' '$read'"
          }
          ensure_user "${RABBITMQ_MANAGEMENT_USER}" "${RABBITMQ_MANAGEMENT_PASSWORD}" "administrator" ".*" ".*" ".*"
          ensure_user "${RABBITMQ_USER}"            "${RABBITMQ_PASSWORD}"            ""               ".*" ".*" ".*"
          if [ -n "${RABBITMQ_ERP_USER:-}" ] && [ -n "${RABBITMQ_ERP_PASSWORD:-}" ]; then
            ensure_user "${RABBITMQ_ERP_USER}"      "${RABBITMQ_ERP_PASSWORD}"        "" 'erp\..*|erp_out\..*|external\..*' 'erp\..*' 'erp_out\..*|external\..*'
          fi
          # Удаляем дефолтного guest, если он остался (безопаснее)
          sg docker -c 'docker compose exec -T rabbitmq rabbitmqctl delete_user guest' 2>/dev/null || true

          echo "==> [5.3/7] Настройка топологии RabbitMQ (exchanges, queues, shovels)..."
          sg docker -c 'docker compose exec -T app php artisan rabbitmq:setup' || true

          echo "==> [5.4/7] Синхронизация настроек Meilisearch (typoTolerance, searchable, synonyms)..."
          sg docker -c 'docker compose exec -T app php artisan scout:sync-index-settings' || true
          sg docker -c 'docker compose exec -T app php artisan meilisearch:sync-synonyms' || true

          echo "==> [6/7] Применение compose-конфигурации и перезапуск очередей..."
          # up -d пересоздаёт сервисы с изменёнными портами/env/volumes (mysql, redis,
          # meilisearch, minio и др.). Без этого изменения compose-файла проходят мимо.
          sg docker -c 'docker compose up -d --remove-orphans'
          sg docker -c 'docker compose exec -T app php artisan queue:restart'

          echo "==> [6.1/7] Остановка Vite dev-сервера..."
          # На стенде отдаём собранные ассеты. Контейнер node из compose поднимается
          # вместе с остальными и запускает `npm run dev`, а Vite пишет public/hot —
          # после этого Laravel отдаёт ссылки на http://localhost:5174, которого у
          # тестировщика нет, и страница открывается белым экраном.
          sg docker -c 'docker compose stop node' || true
          rm -f public/hot

          echo "==> [7/7] Перезагрузка PHP-FPM, workers и nginx..."
          # restart нужен даже после up -d: app/worker монтируют код через bind mount,
          # PHP-FPM/queue процессы должны быть перезапущены для подхвата свежего vendor/.
          sg docker -c 'docker compose restart app worker nginx'

          echo ""
          echo "✅ Деплой завершён успешно!"

      - name: "🏥 Health Check"
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/up)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check прошёл (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check не прошёл (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: "📢 Notify on success"
        if: success()
        run: |
          echo "✅ Деплой ветки dev выполнен успешно!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"

      - name: "🔔 Notify on failure"
        if: failure()
        run: |
          echo "❌ Деплой завершился с ошибкой!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
