# docker-compose.prod.yml
#
# Override-файл для production. Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Что делает:
# - Закрывает наружу все служебные порты (mysql, redis, meilisearch, minio).
# - Прокидывает 80/443 для nginx (вместо 8085 на dev).
# - Подменяет пароли всех сервисов на ${VAR} из /srv/pecado/.env (требуются обязательно).
# - Включает OPCache в production-режиме.
# - Выключает mailpit и node контейнеры через profiles=["dev"].
#
# ⚠️ Перед первым запуском заполнить /srv/pecado/.env по шаблону из docs/CICD_PROD_DEPLOYMENT.md §3.3.

services:
  app:
    restart: always
    environment:
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
      PHP_OPCACHE_MAX_ACCELERATED_FILES: "20000"

  nginx:
    restart: always
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

  worker:
    restart: always

  mysql:
    ports: !reset []
    # zz-prod.cnf читается после custom.cnf (conf.d разбирается по алфавиту)
    # и перекрывает buffer pool на прод-значение.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/prod.cnf:/etc/mysql/conf.d/zz-prod.cnf:ro
    environment:
      MYSQL_DATABASE: pecado
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

  mysql-prices:
    ports: !reset []
    environment:
      MYSQL_DATABASE: pecado_prices
      MYSQL_ROOT_PASSWORD: ${DB_PRICES_ROOT_PASSWORD:?DB_PRICES_ROOT_PASSWORD must be set in .env}
      MYSQL_USER: ${DB_PRICES_USERNAME:?DB_PRICES_USERNAME must be set in .env}
      MYSQL_PASSWORD: ${DB_PRICES_PASSWORD:?DB_PRICES_PASSWORD must be set in .env}

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--appendonly", "yes"]

  rabbitmq:
    # 5672 — AMQP для 1С. Через UFW открыть только для IP сервера 1С.
    # 15672 — Management UI, биндим на localhost (внешний доступ через SSH-туннель).
    ports: !override
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_MANAGEMENT_USER:?RABBITMQ_MANAGEMENT_USER must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_MANAGEMENT_PASSWORD:?RABBITMQ_MANAGEMENT_PASSWORD must be set in .env}

  meilisearch:
    ports: !reset []
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production

  minio:
    # API (9000) — биндим только на внутренний интерфейс 10.2.2.101 (локальная сеть для 1С).
    # Наружу через 93.94.150.16 не торчит. Дополнительно UFW: allow from 10.2.2.0/24 to any port 9000.
    # Console (9001) — на localhost (через SSH-туннель).
    ports: !override
      - "10.2.2.101:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}

  # ── Сервисы, которые на проде не запускаем ──────────────────────────
  # На dev они стартуют автоматически. На проде включаются только при
  # явном `--profile dev`, что используется только локально/в отладке.

  mailpit:
    profiles: ["dev"]   # реальный SMTP в /srv/pecado/.env (см. MAIL_HOST)

  node:
    profiles: ["dev"]   # фронт собирает CI, на проде node-контейнер не нужен

  createbuckets:
    profiles: ["dev"]   # бакеты создаются вручную при первом запуске prod
