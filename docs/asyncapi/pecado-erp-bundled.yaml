              - rejected
            description: >
              Статус возврата в перечислении 1С:КА2 (v15). Шесть значений

              жизненного цикла. Маппинг русских названий 1С → канонические
              ключи:


              | Название в 1С | Канонический ключ | Метка на сайте |

              |---|---|---|

              | На согласовании | `pending_approval` | На согласовании |

              | К возврату | `for_return` | К возврату |

              | В резерве | `in_reserve` | В резерве |

              | К отгрузке | `ready_for_shipment` | К отгрузке |

