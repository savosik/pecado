    ContractorBalance:
      type: object
      required:
        - tax_id
        - current_balance
        - overdue_debt
      properties:
        uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            UUID контрагента в 1С (Company.erp_id на сайте). Приоритет при
            матчинге Company и заполнении ContractorBalance.contractor_uuid
            (v13.2).
        tax_id:
          type: string
          description: >-
            Налоговый идентификатор контрагента (ИНН / УНП / БИН и т.д.).
            Fallback-идентификатор для матчинга, когда uuid ещё не выгружен.
        current_balance:
          type: number
          description: Текущий баланс (отрицательное = задолженность)
        overdue_debt:
          type: number
          minimum: 0
          description: Просроченная задолженность
        overdue_details:
          type: array
          items:
            type: object
            properties:
              shipment_uuid:
                type: string
