            передаётся в final_price, а base_price остаётся базовой ценой
            товара-родителя (v15.9.3)
        discount_percent:
          type: number
          maximum: 100
          description: >-
            Процент корректировки цены: положительное значение означает скидку,
            отрицательное — наценку без ограничений, 0 — без корректировки
            (v12.7.1). В заказах type=defect — глубина уценки относительно
            base_price, величина производная: сумма позиции считается по
            final_price (v15.9.3)
        final_price:
          type: number
          minimum: 0
          description: >-
            Конечная цена за единицу после корректировки (v12.7.1). final_price
            = base_price × (1 - discount_percent / 100); при отрицательном
            discount_percent итоговая цена может быть выше base_price. В заказах
            type=promo и type=promo_sample равенство не выполняется: там
            final_price — цена из награды акции, и она авторитетна (v15.6). В
            заказах type=defect final_price — цена уценки, заданная закупщиком,
            и она также авторитетна (v15.9.3)
        is_promo:
          type: boolean
          description: >
            Позиция выдана акцией, а не куплена клиентом (v15.6).

            Присутствует только в заказах `type=promo` и `type=promo_sample`.

            1С может проставить флаг и для позиции, добавленной менеджером
            вручную, —

            сайт такую позицию принимает и не пытается сопоставить её с правилом
            акции.
        promo_kind:
          type:
            - string
            - 'null'
          enum:
            - accountable
            - sample
            - null
          description: |
            Вид промо-позиции (v15.6):
              - `accountable` — подотчётная, выписывается в накладную клиенту;
              - `sample` — рекламный образец, в накладную не выписывается.
            Присутствует только у позиций с `is_promo = true`.
