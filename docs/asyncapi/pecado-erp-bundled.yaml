                    - type: 'null'
                quantity:
                  type: number
                  minimum: 0
                price:
                  type: number
                  minimum: 0
                  description: Базовая цена
                auto_discount_percent:
                  type: number
                  maximum: 100
                  description: >-
                    Процент автоматической скидки (отрицательное значение —
                    наценка без ограничений)
                manual_discount_percent:
                  type: number
