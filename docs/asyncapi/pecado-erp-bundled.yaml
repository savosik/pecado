                по хардкоду из v15.7.1).


                Справочник организаций **по шине не передаётся**: юрлица
                заводятся в админке сайта

                вручную, как склады. Поэтому достаточно `uuid` — остальные поля
                необязательны

                и используются только если организации с таким UUID на сайте ещё
                нет.


                Объект без `uuid` сайт игнорирует. Неизвестный `uuid` создаёт
