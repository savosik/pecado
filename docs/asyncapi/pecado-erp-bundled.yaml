            - string
            - 'null'
          description: Номер возврата в 1С. Сохраняется как erp_number на сайте.
        organization:
          allOf:
            - type: object
              description: >
                Наша организация (юрлицо), от имени которой документ проведён в
                1С.


                **Направление: только 1С → Сайт.** Сайт организацию не
