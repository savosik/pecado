                    legal_name:
                      type:
                        - string
                        - 'null'
                      description: Полное юридическое наименование. Необязательно.
                    tax_id:
                      type:
                        - string
                        - 'null'
                      description: ИНН организации. Необязательно.
                    tax_code:
                      type:
                        - string
                        - 'null'
                      description: КПП организации. Необязательно.
              description: >
                Организация возврата (v15.8.0). Опционально, **справочно**: сайт
                выводит её

                из реализаций-оснований сам. Если 1С прислала значение — оно
                приоритетнее.
            status:
              type: string
              enum:
                - pending_approval
                - for_return
                - in_reserve
                - ready_for_shipment
                - completed
                - rejected
              description: >
                Статус возврата в перечислении 1С:КА2 (v15). Шесть значений

                жизненного цикла. Маппинг русских названий 1С → канонические
                ключи:


                | Название в 1С | Канонический ключ | Метка на сайте |

                |---|---|---|

                | На согласовании | `pending_approval` | На согласовании |

                | К возврату | `for_return` | К возврату |

                | В резерве | `in_reserve` | В резерве |

                | К отгрузке | `ready_for_shipment` | К отгрузке |

                | Выполнена | `completed` | Выполнена |

                | Отклонена | `rejected` | Отклонена |


                Legacy-ключи до v15 (`pending`, `confirmed`, `ready_to_ship`,

                `closed`, `cancelled`) принимаются сайтом для обратной
                совместимости

                через `App\Services\Erp\Support\ReturnStatusMapper` (см.

                docs-erp/content/rules/returns.md).
      returnDeleted:
