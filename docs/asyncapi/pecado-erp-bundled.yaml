          weight_net:
            type:
              - number
              - 'null'
            minimum: 0
            description: |
              (v13.3) Вес нетто товара в **килограммах**. Семантика частичного
              обновления.
          width:
            type:
              - number
              - 'null'
            minimum: 0
            description: |
