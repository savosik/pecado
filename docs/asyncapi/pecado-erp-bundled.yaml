            height:
              type:
                - number
                - 'null'
              minimum: 0
              description: >
                (v13.3) Высота упаковки в **метрах**. Источник 1С —

                `Упаковки.Высота`. Хранится в `products.height`
                (`decimal(10,2)`).
              examples:
                - 0.12
            depth:
              type:
                - number
                - 'null'
              minimum: 0
              description: >
                (v13.3) Глубина упаковки в **метрах**. Источник 1С —

                `Упаковки.Глубина`. Хранится в `products.depth`
                (`decimal(10,2)`).
              examples:
                - 0.08
            hs_code:
              type:
                - string
                - 'null'
              maxLength: 20
              description: |
                (v13.3) Код ТН ВЭД (Гармонизированная система). Источник 1С —
                `Номенклатура.КодТНВЭД.Код`. Хранится как строка в
                `products.hs_code` (`varchar(20)`). Поле `tnved` (legacy)
                продолжает работать независимо.
              examples:
                - '6204620000'
            abc_xyz:
              type:
                - string
                - 'null'
              maxLength: 5
              description: |
                (v13.3) ABC/XYZ-классификация товара. Двухсимвольный код вида
                `AX`, `BY`, `CZ`. Хранится в `products.abc_xyz` (`varchar(5)`).
              examples:
                - AX
            turnover:
              type:
                - number
                - 'null'
              minimum: 0
              description: |
