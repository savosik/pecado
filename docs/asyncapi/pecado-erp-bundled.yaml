        Каждая позиция несёт snapshot цены из ShipmentItem на момент создания
        возврата, чтобы 1С провела возврат в той же валюте и по той же цене,
        по которой была оформлена реализация.
      required:
        - event
        - uuid
        - partner_uuid
        - items
      properties:
        event:
          type: string
          const: return.created
        message_id:
          type: string
        uuid:
          type: string
          format: uuid
