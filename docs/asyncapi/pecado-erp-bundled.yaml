            hs_code:
              type:
                - string
                - 'null'
              maxLength: 20
              description: |
                (v13.3) Код ТН ВЭД. Семантика частичного обновления.
            abc_xyz:
              type:
                - string
                - 'null'
              maxLength: 5
              description: >
                (v13.3) ABC/XYZ-классификация товара. Семантика частичного
