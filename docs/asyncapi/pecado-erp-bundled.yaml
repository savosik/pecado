                `products.turnover` (`decimal(12,4)`).
              examples:
                - 14.75
            attributes:
              type: array
              description: >
                Полный актуальный список атрибутов товара. Семантика
                **full-replace**:

                сайт синхронизирует состав атрибутов товара строго по этому
                массиву.

                Атрибуты, отсутствующие в массиве, **удаляются** у товара.

                Пустой массив `[]` означает «удалить все атрибуты товара».

                1С обязана передавать полный набор атрибутов при создании
                товара.
              items:
                type: object
                required:
                  - property_uuid
                  - property_label
                  - value_type
                properties:
