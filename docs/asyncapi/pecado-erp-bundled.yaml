              по умолчанию "order".


              **⚠️ v15.9.0 — для предзаказов, заведённых в 1С, поле
              обязательно.**

              Если менеджер создаёт предзаказ в 1С, документ должен уйти на сайт

              с `type: "preorder"`: по этому полю сайт ставит позиции **в резерв

              у поставщика** (у 1С своего канала к поставщику нет). Иных
              признаков

              предзаказа у сайта нет — без `"preorder"` документ сохранится как

              обычный заказ и резерв не уйдёт. Для остальных типов 1С может поле

              не передавать, как и раньше.

              См. [Заказы → Предзаказы из 1С](/docs/erp-guide/rules/orders/).


