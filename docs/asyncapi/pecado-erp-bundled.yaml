          `ShipmentCreatedPayload`;

          отличается только значением поля `event`. Разделение на две схемы
          сделано на вырост — при

          появлении у события `shipment.updated` собственных полей схема
          эволюционирует независимо.
        required:
          - event
          - message_id
          - uuid
          - contractor_uuid
          - tax_id
          - number
          - date
          - status
          - currency_code
          - items
