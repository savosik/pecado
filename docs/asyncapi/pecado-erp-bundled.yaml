                `Упаковки.Вес` (первая непомеченная упаковка). Десятичный

                разделитель — точка. Хранится в `products.weight_gross`
                (`decimal(10,3)`).
              examples:
                - 1.25
            weight_net:
              type:
                - number
                - 'null'
              minimum: 0
              description: |
                (v13.3) Вес нетто товара в **килограммах**. Источник 1С —
                `Номенклатура.ЕдиницаИзмерения.Вес`. Хранится в
                `products.weight_net` (`decimal(10,3)`).
              examples:
