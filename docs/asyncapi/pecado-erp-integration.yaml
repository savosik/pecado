    # ── US-05: Курсы валют ───────────────────
    ExchangeRateUpdatedPayload:
      type: object
      required:
        - event
        - message_id
        - currency_code
        - official_rate
        - rate_coefficient
        - rate
        - base_currency_code
        - date
      properties:
        event:
          type: string
          const: exchange_rate.updated
        message_id:
          type: string
          examples:
            - 'msg-rate-kzt-20260317'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        official_rate:
          type: number
          description: Курс нацбанка (с учётом кратности)
          examples:
            - 5.40
        rate_coefficient:
          type: number
          description: Поправочный коэффициент из настроек
          examples:
            - 1.01
        rate:
          type: number
          description: 'Итоговый курс = official_rate × rate_coefficient'
          examples:
            - 5.454
        base_currency_code:
          type: string
          const: RUB
          description: "Базовая валюта, всегда \"RUB\""
        date:
          $ref: '#/components/schemas/ISO8601Date'

    # ── US-06: Остатки ───────────────────────
    StockUpdatedPayload:
      type: object
      required:
        - event
        - message_id
        - product_uuid
        - warehouse_uuid
        - quantity
      properties:
        event:
          type: string
          const: stock.updated
        message_id:
          type: string
          examples:
            - 'msg-stock-a1b2c3d4-w1a2b3c4'
        product_uuid:
          $ref: '#/components/schemas/UUID'
        warehouse_uuid:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: number
          minimum: 0
          description: |
            Свободный остаток товара на складе, доступный к продаже прямо сейчас (≥ 0).

            **v15.16.0: формулировка приведена к тому, как 1С считает на самом деле.**
            Величина берётся из регистра «Запасы и потребности»: «В наличии» минус
            «Резервировать на складе», с учётом назначения и разреза по организации.
            Прежний текст («ВНаличии − КОтгрузке») описывал ресурсы регистра товаров
            на складах, где ресурса «К отгрузке» не существует вовсе, и был менее
            точен: разрезов по назначению и организации в нём нет.

            Контракт описывает смысл, а не арифметику: если расчёт в 1С изменится,
            меняется этот текст, а не требование к величине.
          examples:
            - 42

