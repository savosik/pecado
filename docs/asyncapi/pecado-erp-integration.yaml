        revision:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Номер ревизии документа в 1С (v15.16.0).

            Монотонно возрастает в рамках **одного** `uuid`: каждое изменение документа
            увеличивает его. Глобальная монотонность не требуется и не проверяется.

            Поле опционально — сообщение без `revision` применяется без проверки, чтобы
            1С могла включать его по каналам постепенно. Сообщение с `revision` меньше
            или равным уже применённому сайт **отбрасывает** как устаревшее и пишет об
            этом в журнал шины со статусом «Устаревшее».

            Зачем: порядок доставки не гарантирован ни между очередями, ни внутри одной
            очереди при `numprocs > 1`. Отличить свежее сообщение от устаревшего по
            `erp_updated_at` нельзя — у двух отправок по одному документу он совпадает
            до секунды.
          examples:
            - 7
        uuid:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          minLength: 1
          examples:
            - '29УТ-002488'
        date:
          type: string
          format: date-time
          examples:
            - '2026-07-30T23:59:59+03:00'
        direction:
          type: string
          enum:
            - in
            - out
        operation_code:
          type:
            - string
            - 'null'
        operation_name:
          type:
            - string
            - 'null'
        document_type:
          type:
            - string
            - 'null'
        contractor_uuid:
          type: string
          format: uuid
        partner_uuid:
          type:
            - string
            - 'null'
          format: uuid
        tax_id:
          type: string
        amount:
          type: number
          minimum: 0
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        organization:
          $ref: '#/components/schemas/DocumentOrganization'
        organization_account:
          $ref: '#/components/schemas/OrganizationBankAccount'
        payer_account:
          $ref: '#/components/schemas/PayerBankAccount'
        bank_number:
          type:
            - string
            - 'null'
        bank_date:
          type:
            - string
            - 'null'
          format: date
        bank_confirmed:
          type:
            - boolean
            - 'null'
        bank_confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        uip:
          type:
            - string
            - 'null'
        purpose:
          type:
            - string
            - 'null'
        comment:
          type:
            - string
            - 'null'
          description: |
            Комментарий к платёжному документу из 1С (v15.16.0).

            Не путать с `purpose` — тот содержит назначение платежа из банковской
            выписки. Это разные поля и разный смысл.

            Сайт хранит комментарий 1С **отдельно** от собственного комментария
            сотрудника и не перезаписывает последний: заметка менеджера в 1С
            не уходит и оттуда не приходит.
        erp_created_at:
          type:
            - string
            - 'null'
          format: date-time
        erp_updated_at:
          type:
            - string
            - 'null'
          format: date-time
        allocations:
          type: array
          description: |
            Разнесение целиком. Ключ отсутствует — сайт сохраняет текущее разнесение
