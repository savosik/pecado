          description: "Налоговый идентификатор контрагента (ИНН / УНП / БИН и т.д.)"
        registration_number:
          type:
            - string
            - 'null'
        tax_code:
          type:
            - string
            - 'null'
        okpo_code:
          type:
            - string
            - 'null'
        legal_address:
          type:
            - string
            - 'null'
        actual_address:
          type:
