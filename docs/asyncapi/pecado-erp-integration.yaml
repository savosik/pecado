        uuid:
          $ref: '#/components/schemas/UUID'
        contractor_uuid:
          type: string
          format: uuid
          description: "UUID контрагента в 1С (Company.erp_id на сайте). Required с v13.3 — приоритет при матчинге Company, fallback на tax_id."
        partner_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: "UUID партнёра-владельца. Опциональное поле — отгрузка может быть технической (внутренние перемещения)."
        tax_id:
          type: string
          description: "Налоговый идентификатор контрагента (ИНН / УНП / БИН и т.д.)"
          examples:
            - '7710140679'
        number:
          type: string
          minLength: 1
          description: "Номер реализации в 1С. Сохраняется как erp_number на сайте. Обязательное поле, используется клиентом и менеджером для коммуникации."
          examples:
            - '29УТ-003413'
        organization:
          $ref: '#/components/schemas/DocumentOrganization'
        warehouse_uuid:
          $ref: '#/components/schemas/PostedWarehouseUuid'
        date:
          $ref: '#/components/schemas/ISO8601Date'
        erp_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время создания документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        erp_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время последнего изменения документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        status:
          type: string
          const: completed
          description: "Всегда \"completed\""
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
