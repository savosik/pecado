    # ── US-08: Заказы ────────────────────────
    OrderItem:
      type: object
      required:
        - product_uuid
        - quantity
        - base_price
        - discount_percent
        - final_price
      properties:
        line_number:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            Номер строки в табличной части «Товары» документа 1С (v15.16.0).

            Формально необязателен, фактически нужен всегда. Это единственный способ
            различить две строки на один товар и единственный ключ, по которому сайт
            обновляет позицию, а не пересоздаёт её заново.

            Без него сайт подставляет порядковый номер элемента в массиве. Это деградация,
            а не штатный режим: при перестановке строк в 1С складские привязки позиций
            (партия некондиции, промо-правило) разъедутся по строкам.

            Номер обязан быть **постоянным для строки** на всём жизненном цикле документа.
        product_uuid:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: number
          minimum: 1
          description: Количество
        cancelled:
          type:
            - boolean
            - 'null'
          description: |
            Строка отменена в 1С (v15.16.0).

            Так оформляется **недобор**: товара не хватило на складе, упаковщик дробит
            строку — часть остаётся, часть отменяется. В сообщении появляются две строки
            на один товар, у которых совпадает всё, кроме `quantity` и этого признака.

            Отсутствие поля и `null` означают «не отменена».

            Поведение сайта: отменённая строка сохраняется, показывается клиенту отдельным
            видом и **не входит в сумму заказа**. До v15.16.0 сайт признак не читал,
            и отменённое количество попадало в `total_amount` наравне с активным.
        base_price:
          type: number
          minimum: 0
          description: 'Базовая цена за единицу (до скидки, v7). Всегда прайсовая цена карточки товара — в том числе в заказах type=defect, где цена уценки передаётся в final_price, а base_price остаётся базовой ценой товара-родителя (v15.9.3)'
        discount_percent:
          type: number
          maximum: 100
          description: 'Процент корректировки цены: положительное значение означает скидку, отрицательное — наценку без ограничений, 0 — без корректировки (v12.7.1). В заказах type=defect — глубина уценки относительно base_price, величина производная: сумма позиции считается по final_price (v15.9.3)'
        final_price:
          type: number
          minimum: 0
          description: 'Конечная цена за единицу после корректировки (v12.7.1). final_price = base_price × (1 - discount_percent / 100); при отрицательном discount_percent итоговая цена может быть выше base_price. В заказах type=promo и type=promo_sample равенство не выполняется: там final_price — цена из награды акции, и она авторитетна (v15.6). В заказах type=defect final_price — цена уценки, заданная закупщиком, и она также авторитетна (v15.9.3)'
        is_promo:
          type: boolean
          description: |
            Позиция выдана акцией, а не куплена клиентом (v15.6).
            Присутствует только в заказах `type=promo` и `type=promo_sample`.
            1С может проставить флаг и для позиции, добавленной менеджером вручную, —
            сайт такую позицию принимает и не пытается сопоставить её с правилом акции.
        promo_kind:
          type:
            - string
            - 'null'
          enum:
            - accountable
            - sample
            - null
          description: |
            Вид промо-позиции (v15.6):
              - `accountable` — подотчётная, выписывается в накладную клиенту;
              - `sample` — рекламный образец, в накладную не выписывается.
            Присутствует только у позиций с `is_promo = true`.

    OrderContractor:
