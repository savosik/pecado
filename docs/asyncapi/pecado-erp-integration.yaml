    GoodsIssueDeletedPayload:
      type: object
      description: |
        Отмена проведения (или пометка на удаление) расходного ордера в 1С. Сайт помечает
        ордер удалённым и убирает из журнала склада, но данные сохраняет: повторное
        проведение того же документа вернёт ордер со всем составом и историей статусов.
      required:
        - event
        - message_id
        - uuid
      properties:
        event:
          type: string
          const: goods_issue.deleted
          description: Тип события
        message_id:
          type: string
          description: Уникальный ID сообщения для идемпотентности
        uuid:
          $ref: '#/components/schemas/UUID'
      examples:
        - event: goods_issue.deleted
          message_id: msg-gi-del-a1b2c3d4
          uuid: 7f3d9c10-4b21-4e8a-9c55-1a2b3c4d5e6f

    OrganizationBankAccount:
      type: object
      description: |
        **Наш** банковский счёт — счёт организации-получателя, на который поступили деньги.

        Разведён с `PayerBankAccount` в v15.16.0. До этого оба счёта описывались одним
        типом с дословно одинаковым текстом, и различить их можно было только по имени
        ключа. Цена ошибки прикладная: перепутав их, клиент увидел бы в кабинете
        собственный счёт вместо нашего и решил бы, что деньги ушли не туда.

        Справка для сотрудника и клиента: сайт показывает её как есть и связей по ней
        не строит. Не путать с `BankAccount` — там полные реквизиты счёта из справочника
        контрагентов.
      properties:
        number:
          type:
            - string
            - 'null'
          description: Номер нашего счёта.
          examples:
            - '2693'
        bank_name:
          type:
            - string
            - 'null'
          description: Банк, в котором открыт наш счёт.
          examples:
            - 'ПАО СБЕРБАНК'

    PayerBankAccount:
      type: object
      description: |
        Банковский счёт **плательщика** — счёт клиента, с которого пришли деньги.

        Разведён с `OrganizationBankAccount` в v15.16.0, состав полей у них совпадает.
        Различие только смысловое, и оно существенно: это счёт клиента, а не наш.
      properties:
        number:
          type:
            - string
            - 'null'
          description: Номер счёта плательщика.
          examples:
            - '40702810000000001234'
        bank_name:
          type:
            - string
            - 'null'
          description: Банк плательщика.
          examples:
            - 'ООО Банк Точка'

    PaymentAllocation:
      type: object
      description: |
        Строка табличной части «Расшифровка платежа» — сумма, разнесённая на один документ.

        **v15.16.0: расшифровка не ограничена реализациями.** По замеру 1С на боевой базе
        за 2026 год на реализации ложится 58% строк и лишь 28,6% денег; остальное — предоплаты
        по заказам клиентов, первичные документы и отчёты комиссионера. До v15.16.0 такие
        строки контракт не вмещал вовсе.

        Тип документа задаётся полем `target_type`, а ключ связи зависит от него:

        | `target_type` | Обязательное поле | Что делает сайт |
        |---|---|---|
        | `shipment` (или отсутствует) | `shipment_uuid` | Засчитывает оплату реализации |
        | `order` | `order_uuid` | Показывает предоплату в карточке заказа |
        | `other` | — | Сохраняет строку как есть, показывает `target_name` |

        Связь строится по uuid, а не по номеру: документ может ещё не приехать на сайт,
        и тогда строка сохраняется без привязки, а связь доклеивается при его получении.

        **Оплату реализации закрывают только строки `shipment`.** Предоплата по заказу
        накладную не гасит: пока реализации нет, гасить нечего. Когда она появится,
        1С переразносит платёж и присылает его целиком заново.
      required:
        - amount
      properties:
        target_type:
          type:
            - string
            - 'null'
          enum:
            - shipment
            - order
            - other
            - null
          description: |
            Тип документа, на который разнесена строка (расширено в v15.16.0):

            - `shipment` — реализация;
            - `order` — заказ клиента (предоплата);
            - `other` — прочий документ расшифровки (первичный документ, отчёт комиссионера).

            Отсутствие поля и `null` трактуются как `shipment` — обратная совместимость
            с v15.11.0. Строка с типом вне перечисления пропускается с предупреждением в лог.
        shipment_uuid:
          description: |
            UUID реализации. Обязателен при `target_type = shipment` и при отсутствии
            `target_type` — строка без него будет пропущена.

            С v15.16.0 поле nullable: у строк по заказу и прочим документам реализации нет.
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        order_uuid:
          description: |
            UUID заказа клиента.

            **Обязателен при `target_type = order`** — по нему сайт показывает клиенту
            предоплату в карточке заказа. При `target_type = shipment` опционален
            и служит справочной связью.
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        target_uuid:
          description: |
            UUID документа для `target_type = other` (v15.16.0).

            Сайт такие строки ни с чем не связывает — они показываются как есть.
            Но uuid нужен, чтобы строку можно было найти в 1С.
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        target_name:
          type:
            - string
            - 'null'
          description: |
            Представление документа строкой, как в 1С (v15.16.0). Только для показа.

            Для `target_type = other` это единственное, что клиент и менеджер увидят
            в расшифровке, — заполняйте осмысленно.
          examples:
            - 'Отчёт комиссионера 29УТ-000112 от 14.03.2026'
        shipment_number:
          type:
            - string
            - 'null'
          description: Номер реализации. Только для диагностики и логов — связь по нему сайт не строит.
          examples:
            - '29УТ-003413'
        amount:
          type: number
          minimum: 0
          description: Сумма, разнесённая на этот документ, в валюте платежа. Всегда положительная — знак определяет `direction` платежа.
          examples:
            - 1200.00
        line_number:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Номер строки в табличной части. Сохраняет порядок показа.

    PaymentCreatedPayload:
      type: object
      description: |
        Платёжный документ из 1С: поступление оплаты от клиента или возврат оплаты клиенту
        (банк или касса). Онлайн-эквайринг сайта по этой очереди не передаётся.
      required:
        - event
        - message_id
        - uuid
        - contractor_uuid
        - tax_id
        - number
        - date
        - direction
        - amount
        - currency_code
        - allocations
      properties:
        event:
          type: string
          const: payment.created
        message_id:
          type: string
          examples:
            - 'msg-payment-p1a2b3c4'
        revision:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Номер ревизии документа в 1С (v15.16.0).

            Монотонно возрастает в рамках **одного** `uuid`: каждое изменение документа
            увеличивает его. Глобальная монотонность не требуется и не проверяется.

            Поле опционально — сообщение без `revision` применяется без проверки, чтобы
            1С могла включать его по каналам постепенно. Сообщение с `revision` меньше
            или равным уже применённому сайт **отбрасывает** как устаревшее и пишет об
            этом в журнал шины со статусом «Устаревшее».

            Зачем: порядок доставки не гарантирован ни между очередями, ни внутри одной
            очереди при `numprocs > 1`. Отличить свежее сообщение от устаревшего по
            `erp_updated_at` нельзя — у двух отправок по одному документу он совпадает
            до секунды.
          examples:
            - 7
        uuid:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          minLength: 1
          description: "Номер документа в 1С. Не уникален: номера повторяются между организациями и годами, поэтому связь строится только по uuid."
          examples:
            - '29УТ-002488'
        date:
          type: string
          format: date-time
          description: "Дата и время документа в 1С. Время значимо: порядок платежей внутри дня определяет, каким из них закрыта реализация."
          examples:
            - '2026-07-30T23:59:59+03:00'
        direction:
          type: string
          enum:
            - in
            - out
          description: "Направление движения денег: `in` — поступление оплаты от клиента, `out` — возврат оплаты клиенту. Присылайте явно: выводить направление из текста операции сайт не будет."
        operation_code:
          type:
            - string
            - 'null'
          description: "Машинный код операции 1С латиницей: `customer_payment`, `customer_refund`. Нужен вместо разбора русского наименования — оно меняется вместе с настройками учёта."
          examples:
            - 'customer_payment'
        operation_name:
          type:
            - string
            - 'null'
          description: "Наименование операции как в 1С. Показывается сотрудникам как есть, в логике не участвует."
          examples:
            - 'Поступление оплаты от клиента'
        document_type:
          type:
            - string
            - 'null'
          description: "Тип документа 1С. Только для показа."
          examples:
            - 'Платежное поручение'
        contractor_uuid:
          type: string
          format: uuid
          description: "UUID контрагента-плательщика (Company.erp_id на сайте). Приоритетный способ матчинга; fallback на tax_id работает только в паре с partner_uuid. Сохраняется на сайте всегда, даже если контрагент ещё не приехал."
        partner_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: "UUID партнёра-владельца. Настоятельно рекомендуется: без него платёж не привяжется к пользователю сайта и клиент не увидит свою оплату в личном кабинете."
        tax_id:
          type: string
          description: "Налоговый идентификатор плательщика (ИНН / УНП / БИН) на момент проведения документа."
          examples:
            - '7710140679'
        amount:
          type: number
          minimum: 0
          description: "Сумма документа в валюте документа. Всегда положительная — знак определяет `direction`."
          examples:
            - 2325.20
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        organization:
          $ref: '#/components/schemas/DocumentOrganization'
        organization_account:
          $ref: '#/components/schemas/OrganizationBankAccount'
        payer_account:
          $ref: '#/components/schemas/PayerBankAccount'
        bank_number:
          type:
            - string
            - 'null'
          description: "Номер документа по банку. Отличается от номера в 1С — по нему клиенты ищут платёж в своей выписке."
          examples:
            - '9202'
        bank_date:
          type:
            - string
            - 'null'
          format: date
          description: Дата документа по банку.
        bank_confirmed:
          type:
            - boolean
            - 'null'
          description: Флаг «Проведено банком» из 1С.
        bank_confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Дата проведения банком.
        uip:
          type:
            - string
            - 'null'
          description: "УИП — уникальный идентификатор платежа. Значение «0» означает, что УИП не присвоен, и сохраняется как есть."
        purpose:
          type:
            - string
            - 'null'
          description: Назначение платежа из платёжного поручения.
        comment:
          type:
            - string
            - 'null'
          description: |
            Комментарий к платёжному документу из 1С (v15.16.0).

            Не путать с `purpose` — тот содержит назначение платежа из банковской
            выписки. Это разные поля и разный смысл.

            Сайт хранит комментарий 1С **отдельно** от собственного комментария
            сотрудника и не перезаписывает последний: заметка менеджера в 1С
            не уходит и оттуда не приходит.
        erp_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время создания документа в 1С (ISO-8601 с TZ)."
        erp_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время последнего изменения документа в 1С (ISO-8601 с TZ)."
        allocations:
          type: array
          description: |
            Расшифровка платежа. Присылается целиком: сайт заменяет всё разнесение
            платежа содержимым этого массива.

            Пустой массив допустим — платёж целиком станет нераспределённым авансом.

            **Сумма строк не обязана сходиться с `amount` платежа.** Разница хранится
            как нераспределённый остаток и показывается клиенту и менеджеру отдельной
            строкой. Это правило v15.11.0, и v15.16.0 его не меняет — но теперь,
            когда расшифровка вмещает заказы и прочие документы, расхождение должно
            стать редким исключением, а не системой.
          items:
            $ref: '#/components/schemas/PaymentAllocation'

    PaymentUpdatedPayload:
      type: object
      description: |
        Перепроведение платежа в 1С. Структура совпадает с `PaymentCreatedPayload`;
        отличается значением `event` и правилом обработки `allocations`.

        **Отсутствие ключа `allocations` и пустой массив означают разное.** Ключа нет —
        сайт не трогает сохранённое разнесение (используйте, когда меняется только шапка).
        Пустой массив — сайт очищает разнесение полностью, платёж становится авансом.

        Если платежа с таким `uuid` на сайте нет, он будет создан из этого payload:
        потерянный `payment.created` означал бы потерянные деньги в отчётах.
