          type: array
          description: |
            **(v15.12.0)** График оплаты реализации — табличная часть «Правила оплаты» документа 1С.

            **Отсутствие ключа и пустой массив означают разное:** ключа нет — сайт **не трогает**
            сохранённый график (используйте, когда меняются только позиции документа); `[]` —
            сайт **очищает** график полностью. Если 1С опустит ключ, подразумевая «графика больше
            нет», старые плановые даты останутся в календаре клиента.

            График присылается **целиком**; досылать только изменившиеся строки нельзя — сайт
            не умеет отличить «строки не изменились» от «строк больше нет».
          items:
            $ref: '#/components/schemas/ShipmentPaymentScheduleLine'
        invoice:
          $ref: '#/components/schemas/ShipmentInvoice'

