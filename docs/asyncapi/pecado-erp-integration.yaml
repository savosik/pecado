    # ── Организации (наши юрлица), v15.8.0 ───
    DocumentOrganization:
      type: object
      description: |
        Наша организация (юрлицо), от имени которой документ проведён в 1С.

        **Направление: только 1С → Сайт.** Сайт организацию не определяет и не отправляет —
        её выбирает 1С по своим правилам (для `type=promo` и `type=promo_sample` —
        по хардкоду из v15.7.1).

        Справочник организаций **по шине не передаётся**: юрлица заводятся в админке сайта
        вручную, как склады. Поэтому достаточно `uuid` — остальные поля необязательны
        и используются только если организации с таким UUID на сайте ещё нет.

        Объект без `uuid` сайт игнорирует. Неизвестный `uuid` создаёт организацию-заглушку,
        которую дозаполняет администратор; связь документа с юрлицом при этом сохраняется.
      required:
        - uuid
      properties:
        uuid:
          $ref: '#/components/schemas/UUID'
        name:
          type:
            - string
            - 'null'
          description: Краткое название организации. Необязательно.
          examples:
            - 'ООО Пекадо'
        legal_name:
          type:
            - string
            - 'null'
          description: Полное юридическое наименование. Необязательно.
        tax_id:
          type:
            - string
            - 'null'
          description: ИНН организации. Необязательно.
        tax_code:
          type:
            - string
            - 'null'
          description: КПП организации. Необязательно.

    PostedWarehouseUuid:
      type:
        - string
        - 'null'
      format: uuid
      description: |
        Склад, на который документ **фактически проведён** в 1С (v15.8.0). Опционально.

        **Направление: только 1С → Сайт.** Не путать с `warehouse_uuids` исходящего заказа:
        там сайт перечисляет склады региона, а конкретный выбирает 1С.

        Неизвестный сайту склад автоматически не заводится: поле останется пустым,
        факт попадёт в лог.

    OrderCreatedPayload:
      type: object
      required:
        - event
        - message_id
        - uuid
        - status
        - partner_uuid
        - contractor
        - items
      properties:
        event:
          type: string
          const: order.created
        message_id:
          type: string
          examples:
            - 'msg-order-created-site-o1a2b3c4'
        revision:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Номер ревизии документа в 1С (v15.16.0).

            Монотонно возрастает в рамках **одного** `uuid`: каждое изменение документа
            увеличивает его. Глобальная монотонность не требуется и не проверяется.

            Поле опционально — сообщение без `revision` применяется без проверки, чтобы
            1С могла включать его по каналам постепенно. Сообщение с `revision` меньше
            или равным уже применённому сайт **отбрасывает** как устаревшее и пишет об
            этом в журнал шины со статусом «Устаревшее».

            Зачем: порядок доставки не гарантирован ни между очередями, ни внутри одной
            очереди при `numprocs > 1`. Отличить свежее сообщение от устаревшего по
            `erp_updated_at` нельзя — у двух отправок по одному документу он совпадает
            до секунды.
          examples:
            - 7
        uuid:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          description: Номер заказа
          examples:
            - 'ORD-2026-0001'
        date:
          $ref: '#/components/schemas/ISO8601DateTime'
        status:
          type: string
          description: |
            Статус заказа из справочника 1С:КА2 (v14).
            Маппинг русских названий — в docs-erp/content/rules/orders.md.
          enum:
            - pending_approval
            - pending_payment_before_provision
            - ready_for_provision
            - pending_payment_before_shipment
            - awaiting_provision
            - ready_for_shipment
            - shipping
            - awaiting_payment
            - ready_for_closure
            - closed
          examples:
            - pending_approval
        type:
          type: string
          description: |
            Тип заказа. Отправляется сайтом → 1С.
            При получении из 1С, если поле отсутствует, используется значение по умолчанию "order".

            **⚠️ v15.9.0 — для предзаказов, заведённых в 1С, поле обязательно.**
            Если менеджер создаёт предзаказ в 1С, документ должен уйти на сайт
            с `type: "preorder"`: по этому полю сайт ставит позиции **в резерв
            у поставщика** (у 1С своего канала к поставщику нет). Иных признаков
            предзаказа у сайта нет — без `"preorder"` документ сохранится как
            обычный заказ и резерв не уйдёт. Для остальных типов 1С может поле
            не передавать, как и раньше.
            См. [Заказы → Предзаказы из 1С](/docs/erp-guide/rules/orders/).

            Значения:
              - `order` — обычный заказ, комплектуется со складов наличия;
              - `preorder` — предзаказ, комплектуется со складов предзаказа;
              - `defect` — уценка (некондиция): `warehouse_uuids` содержит склад некондиции,
                а `final_price` каждой позиции — цену уценки (не прайсовую). Введено в v15.5.
                `base_price` при этом — **прайсовая цена товара-родителя**, а
                `discount_percent` — глубина уценки относительно неё (v15.9.3).
              - `promo` — подотчётные промо-позиции, выданные акцией: `warehouse_uuids`
                содержит склады наличия региона клиента (как у `order`), позиции
                выписываются в накладную клиенту. Введено в v15.6.
              - `promo_sample` — рекламные образцы (пробники): `warehouse_uuids` содержит
                склад «Москва подарки», позиции в накладную клиенту НЕ выписываются.
                Введено в v15.6.

            Для `promo` и `promo_sample` `final_price` — цена из награды акции; она может
            быть нулевой или копеечной и **берётся авторитетно**: пересчитывать сумму через
            `discount_percent` не нужно. `discount_percent` передаётся только для наглядности
            в печатной форме.

            Одно оформление на сайте может дать до пяти документов: `order`, `preorder`,
            `defect`, `promo`, `promo_sample`.
          examples:
            - order
            - preorder
            - defect
            - promo
            - promo_sample
        partner_uuid:
          $ref: '#/components/schemas/UUID'
        warehouse_uuids:
          type: array
          description: |
            UUID складов (1С выбирает первый найденный).
            Для `type=defect` — UUID склада некондиции.
            Для `type=promo` — склады наличия региона клиента.
            Для `type=promo_sample` — склад «Москва подарки».

            **Направление: Сайт → 1С.** Склады региона взаимозаменяемы, заказ по ним
            не разбивается. В обратную сторону 1С возвращает конкретный склад проведения
            в `warehouse_uuid` (v15.8.0).
          items:
            $ref: '#/components/schemas/UUID'
        organization:
          $ref: '#/components/schemas/DocumentOrganization'
        warehouse_uuid:
          $ref: '#/components/schemas/PostedWarehouseUuid'
        timestamp:
          $ref: '#/components/schemas/ISO8601DateTime'
        erp_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время создания документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        erp_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время последнего изменения документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        contractor:
          $ref: '#/components/schemas/OrderContractor'
        delivery_address:
          type: string
          description: Адрес доставки
        delivery_method:
          type: string
          enum:
            - delivery
            - pickup
          default: delivery
          description: |
            Способ доставки (v15.3). Опциональное поле, отсутствие = `delivery`.
            `delivery` — доставка по адресу, `pickup` — самовывоз.
            При `pickup` поле `delivery_address` = null — адрес не требуется.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        exchange_rate:
          type: number
          description: Курс конвертации
        rate_coefficient:
          type: number
          description: Поправочный коэффициент
        comment:
          type: string
          description: Комментарий покупателя (общий, пишется в стандартный комментарий заказа в 1С)
        manager_comment:
          type:
            - string
            - 'null'
          description: |
            Комментарий для менеджера (v15). Опциональное поле.
            Пишется в реквизит «Комментарий для менеджера» (Доп_КомментарийДляМенеджера) заказа в 1С.
            1С хранит как версионируемый журнал с меткой даты — передавать только текст без дат/префиксов.
            Пустая строка или отсутствие поля — реквизит в 1С не меняется.
        replaces_order_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            UUID заказа, недоборы которого закрывает этот заказ-замена (v16.2.0).
            **Направление: Сайт → 1С.** Опциональное поле, обратно совместимое:
            присутствует только у заказов-замен, созданных из подборки замен по
            отменённым при сборке строкам; 1С, не знающая поле, игнорирует его.
            Текстовая пометка «Замена недоборов по заказу N» в manager_comment
            при этом сохраняется. У обычных заказов поле отсутствует.
        warehouse_comment:
          type:
            - string
            - 'null'
          description: |
            Комментарий для склада (v15). Опциональное поле.
            Пишется в реквизит «Комментарий для склада» (Доп_КомментарийДляСклада) заказа в 1С.
            1С хранит как версионируемый журнал с меткой даты — передавать только текст без дат/префиксов.
            Пустая строка или отсутствие поля — реквизит в 1С не меняется.

            В заказах type=defect, type=promo и type=promo_sample сюда дописывается **лист отбора**
            (v15.5 / v15.7) — по строке на позицию, ниже комментария клиента через пустую строку.
            Кладовщик собирает заказ по печатной форме из 1С, поэтому конкретика должна быть
            в документе, а не только в интерфейсе сайта.
        items:
          type: array
          minItems: 1
          description: |
            Позиции заказа, присылаются **целиком**: сайт приводит состав документа
            к содержимому этого массива.

            **Повтор одного `product_uuid` в разных строках разрешён и агрегации
            не подлежит** (v15.16.0). Каждый элемент массива — отдельная строка заказа.
            Сайт не складывает строки с одинаковым товаром, не считает это ошибкой
            и не выбирает «главную». `uniqueItems` здесь намеренно не задан: недобор —
            ровно тот случай, где две строки на один товар осмысленны.

            Различаются такие строки по `line_number`, а не по товару.
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderUpdatedPayload:
      type: object
      required:
        - event
        - message_id
        - uuid
      properties:
        event:
          type: string
          const: order.updated
        message_id:
          type: string
          examples:
            - 'msg-order-upd-o1a2b3c4'
        revision:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Номер ревизии документа в 1С (v15.16.0).

            Монотонно возрастает в рамках **одного** `uuid`: каждое изменение документа
            увеличивает его. Глобальная монотонность не требуется и не проверяется.

            Поле опционально — сообщение без `revision` применяется без проверки, чтобы
            1С могла включать его по каналам постепенно. Сообщение с `revision` меньше
            или равным уже применённому сайт **отбрасывает** как устаревшее и пишет об
            этом в журнал шины со статусом «Устаревшее».

            Зачем: порядок доставки не гарантирован ни между очередями, ни внутри одной
            очереди при `numprocs > 1`. Отличить свежее сообщение от устаревшего по
            `erp_updated_at` нельзя — у двух отправок по одному документу он совпадает
            до секунды.
          examples:
            - 7
        uuid:
          $ref: '#/components/schemas/UUID'
        number:
          type:
            - string
            - 'null'
          description: "Номер заказа в 1С. Сохраняется как erp_number на сайте для коммуникации с менеджером."
        type:
          type: string
          description: |
            Тип заказа — те же значения, что в `order.created`.
            Поле опционально: если оно не передано, сайт **сохраняет текущий тип**
            документа и не меняет его.

            **⚠️ v15.9.0:** сменить тип уже сохранённого заказа на `preorder`
            обновлением нельзя — резерв у поставщика ставится только при первом
            получении документа с `type: "preorder"` (см. `order.created`).
          enum:
            - order
            - preorder
            - defect
            - promo
            - promo_sample
          examples:
            - preorder
        status:
          type: string
          description: |
            Статус заказа из справочника 1С:КА2 (v14). Десять значений
            перечисления. Маппинг русских названий 1С → канонические ключи:

            | Название в 1С | Канонический ключ |
            |---|---|
            | Ожидается согласование | `pending_approval` |
            | Ожидается оплата до обеспечения | `pending_payment_before_provision` |
            | Готов к обеспечению | `ready_for_provision` |
            | Ожидается оплата до отгрузки | `pending_payment_before_shipment` |
            | Ожидается обеспечение | `awaiting_provision` |
            | Готов к отгрузке | `ready_for_shipment` |
            | В процессе отгрузки | `shipping` |
            | Ожидается оплата | `awaiting_payment` |
            | Готов к закрытию | `ready_for_closure` |
            | Закрыт | `closed` |

            Отдельного статуса «Удалён» больше нет: 1С удаление выражает
            через событие `order.deleted`, сайт делает soft-delete и переводит
            запись в `closed`. Если в `order.updated` придёт legacy-значение
            `deleted` — сайт также сделает soft-delete + status=`closed`.
          enum:
            - pending_approval
            - pending_payment_before_provision
            - ready_for_provision
            - pending_payment_before_shipment
            - awaiting_provision
            - ready_for_shipment
            - shipping
            - awaiting_payment
            - ready_for_closure
            - closed
        partner_uuid:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: |
            UUID партнёра (`User.erp_id`). Опционально, добавлено в v15.4.

            1С присылает это поле фактически с самого начала, но в спецификации
            оно описано не было. Требуется для **самовосстановления** заказа:
            если `order.updated` пришёл по заказу, которого на сайте нет,
            сайт создаёт его из этого payload. Без `partner_uuid` и непустых
            `items` восстановление невозможно — см. rules/orders.md.
        contractor:
          type: object
          description: |
            Контрагент заказа. Опционально, добавлено в v15.4 — см. `partner_uuid`.

            Используется **только** при самовосстановлении заказа. Для уже
            существующего заказа контрагент не переназначается.
          properties:
            uuid:
              allOf:
                - $ref: '#/components/schemas/UUID'
              description: "UUID контрагента в 1С (`Company.erp_id` на сайте)."
            tax_id:
              type: string
              description: "Налоговый идентификатор контрагента (ИНН / УНП / БИН и т.д.)."
            tax_code:
              type:
                - string
                - 'null'
            name:
              type:
                - string
                - 'null'
            legal_name:
              type:
                - string
                - 'null'
        organization:
          $ref: '#/components/schemas/DocumentOrganization'
        warehouse_uuid:
          $ref: '#/components/schemas/PostedWarehouseUuid'
        delivery_address:
          type:
            - string
            - 'null'
          description: "Адрес доставки (строка, v12.1). Сайт создаёт или находит запись в delivery_addresses. Отсутствие ключа — адрес не меняется."
        delivery_method:
          type:
            - string
            - 'null'
          enum:
            - delivery
            - pickup
            - null
          description: |
            Способ доставки (v15.3). `delivery` — доставка по адресу,
            `pickup` — самовывоз. Отсутствие ключа или null —
            способ доставки не меняется.
        erp_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время создания документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        erp_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Аудит-метка: дата-время последнего изменения документа в 1С (ISO-8601 с TZ). Опционально, добавлено в v13.7."
        items:
          type: array
          description: |
            Полностью заменяет текущие позиции.
            Не передавайте items, если обновляете только статус.

            **Повтор одного `product_uuid` в разных строках разрешён и агрегации
            не подлежит** (v15.16.0). Каждый элемент массива — отдельная строка заказа;
            различаются строки по `line_number`. Именно так приезжает недобор:
            строка дробится на остающуюся и отменённую, у которых совпадает всё,
            кроме `quantity` и `cancelled`.
          items:
            $ref: '#/components/schemas/OrderItem'

    # ── US-09: Возвраты ──────────────────────
    ReturnUpdatedPayload:
      type: object
      required:
        - event
        - message_id
        - uuid
      properties:
        event:
          type: string
          const: return.updated
        message_id:
          type: string
        revision:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Номер ревизии документа в 1С (v15.16.0).

            Монотонно возрастает в рамках **одного** `uuid`: каждое изменение документа
            увеличивает его. Глобальная монотонность не требуется и не проверяется.

            Поле опционально — сообщение без `revision` применяется без проверки, чтобы
            1С могла включать его по каналам постепенно. Сообщение с `revision` меньше
            или равным уже применённому сайт **отбрасывает** как устаревшее и пишет об
            этом в журнал шины со статусом «Устаревшее».

            Зачем: порядок доставки не гарантирован ни между очередями, ни внутри одной
            очереди при `numprocs > 1`. Отличить свежее сообщение от устаревшего по
            `erp_updated_at` нельзя — у двух отправок по одному документу он совпадает
            до секунды.
          examples:
            - 7
        uuid:
          $ref: '#/components/schemas/UUID'
        number:
          type:
            - string
            - 'null'
          description: "Номер возврата в 1С. Сохраняется как erp_number на сайте."
        organization:
          allOf:
            - $ref: '#/components/schemas/DocumentOrganization'
          description: |
            Организация возврата (v15.8.0). Опционально, **справочно**: сайт выводит её
            из реализаций-оснований сам. Если 1С прислала значение — оно приоритетнее.
        status:
          type: string
          enum:
            - pending_approval
            - for_return
            - in_reserve
            - ready_for_shipment
            - completed
            - rejected
          description: |
            Статус возврата в перечислении 1С:КА2 (v15). Шесть значений
            жизненного цикла. Маппинг русских названий 1С → канонические ключи:

            | Название в 1С | Канонический ключ | Метка на сайте |
            |---|---|---|
            | На согласовании | `pending_approval` | На согласовании |
            | К возврату | `for_return` | К возврату |
            | В резерве | `in_reserve` | В резерве |
            | К отгрузке | `ready_for_shipment` | К отгрузке |
            | Выполнена | `completed` | Выполнена |
            | Отклонена | `rejected` | Отклонена |

            Legacy-ключи до v15 (`pending`, `confirmed`, `ready_to_ship`,
            `closed`, `cancelled`) принимаются сайтом для обратной совместимости
            через `App\Services\Erp\Support\ReturnStatusMapper` (см.
            docs-erp/content/rules/returns.md).

    ReturnCreatedPayload:
      type: object
      description: |
        Возврат покупателя. Позиции привязаны к реализациям (shipment_items),
        а не к заказам — возвращать можно только то, что реально отгружено.
        Каждая позиция несёт snapshot цены из ShipmentItem на момент создания
        возврата, чтобы 1С провела возврат в той же валюте и по той же цене,
        по которой была оформлена реализация.
      required:
        - event
        - message_id
        - uuid
        - partner_uuid
        - items
      properties:
        event:
          type: string
          const: return.created
        message_id:
          type: string
        uuid:
          $ref: '#/components/schemas/UUID'
        partner_uuid:
          $ref: '#/components/schemas/UUID'
        timestamp:
          $ref: '#/components/schemas/ISO8601DateTime'
        comment:
          type:
            - string
            - 'null'
          description: Комментарий к возврату
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_uuid
              - shipment_uuid
              - shipment_number
              - quantity
              - price
              - currency_code
            properties:
              product_uuid:
                $ref: '#/components/schemas/UUID'
              shipment_uuid:
                $ref: '#/components/schemas/UUID'
                description: UUID реализации, в которой был отгружен возвращаемый товар
              shipment_number:
                type: string
                minLength: 1
                description: Человекочитаемый номер реализации (shipments.number)
              quantity:
                type: number
                minimum: 1
              price:
                type: number
                minimum: 0
                description: Цена одной единицы из ShipmentItem.price на момент создания возврата (snapshot)
              currency_code:
                type: string
                minLength: 3
                description: Валюта реализации, из которой возвращается позиция (shipments.currency_code)
              subtotal:
                type: number
                minimum: 0
                description: Сумма позиции возврата — price × quantity, округлённая до 2 знаков
              reason:
                type:
                  - string
                  - 'null'

    # ── US-10: Реализации ────────────────────
    ShipmentItem:
      type: object
      required:
        - product_uuid
        - quantity
        - price
        - auto_discount_percent
        - manual_discount_percent
        - total
        - vat_rate
      properties:
        product_uuid:
          $ref: '#/components/schemas/UUID'
        order_uuid:
          description: UUID исходного заказа
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        quantity:
          type: number
          minimum: 0
        price:
          type: number
          minimum: 0
          description: Базовая цена
        auto_discount_percent:
          type: number
          maximum: 100
          description: Процент автоматической скидки (отрицательное значение — наценка без ограничений)
        manual_discount_percent:
          type: number
          maximum: 100
          description: Процент ручной скидки (отрицательное значение — наценка без ограничений)
        total:
          type: number
          description: Итоговая сумма строки
        vat_rate:
          type: number
          description: Ставка НДС (%)
          examples:
            - 20

    ShipmentInvoice:
      type:
        - object
        - 'null'
      description: |
        Счёт-фактура по реализации (v15.16.0).

        До v15.16.0 места под неё в контракте не было вовсе: все вхождения слова
        `invoice` в спецификации относились к значению `invoice_date` перечисления
        `basis` графика оплаты — то есть к дате счёта на оплату, а не к счёту-фактуре.
        1С при этом реквизит уже присылала, а данные нужны бухгалтерии клиента.

        В логике сайта не участвует: показывается клиенту и менеджеру как справка.
      properties:
        number:
          type:
            - string
            - 'null'
          description: |
            Номер счёта-фактуры как он хранится в 1С: реквизит «Номер», с префиксом
            организации и ведущими нулями. Служит для сверки с 1С.
          examples:
            - '29УТ-0006968'
        number_display:
          type:
            - string
            - 'null'
          description: |
            Номер счёта-фактуры как он напечатан на бумаге (v15.16.1): `ПредставлениеНомера`
            из 1С — без префикса организации и без ведущих нулей.

            **Именно этот номер сайт показывает клиенту:** бухгалтерия сверяет по печатной
            форме, которую держит в руках, а не по внутреннему номеру базы. Если поле
            не прислано, показывается `number`.
          examples:
            - 'УТ-6968'
        date:
          type:
            - string
            - 'null'
          format: date
          description: Дата счёта-фактуры.

    ShipmentPaymentScheduleLine:
      type: object
      description: |
        Строка графика оплаты — табличная часть «Правила оплаты» реализации в 1С (v15.12.0).

        Обязательны только `due_date` и `amount`: на них строится календарь оплат клиента
        и календарь поступления денег менеджера. Остальное — справочные поля документа.

        Пары «код + наименование» (`basis` / `basis_name`, `stage` / `stage_name`) заведены
        намеренно: логика сайта опирается только на латинский код, потому что русское
        наименование в 1С меняется вместе с настройками учёта.
      required:
        - due_date
        - amount
      properties:
        line_number:
          description: "Номер строки табличной части («N»). При отсутствии сайт нумерует строки по порядку в массиве."
          type:
            - integer
            - 'null'
          minimum: 1
          examples:
            - 1
        due_date:
          description: "Плановая дата платежа («Дата платежа»). Обязательное поле: строка без даты для календаря бессмысленна и сайтом пропускается."
          $ref: '#/components/schemas/ISO8601Date'
        amount:
          type: number
          minimum: 0
          description: "Сумма платежа по строке в валюте документа. Сумма строк должна сходиться с суммой реализации — расхождение сайт покажет, но исправлять не будет."
          examples:
            - 2325.20
        percent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: "Доля платежа от суммы документа («% платежа»). Только для показа: сайт считает по `amount`."
          examples:
            - 100
        term_days:
          type:
            - integer
            - 'null'
          minimum: 0
          description: "Отсрочка в днях («Срок (дни)»). Справочно — плановая дата уже посчитана в 1С и приходит в `due_date`."
          examples:
            - 30
        basis:
          type:
            - string
            - 'null'
          enum:
            - shipment_date
            - order_date
            - invoice_date
            - null
          description: "Машинный код варианта отсчёта отсрочки («Вариант отсчёта»): `shipment_date` — от даты отгрузки, `order_date` — от даты заказа, `invoice_date` — от даты счёта."
          examples:
            - shipment_date
        basis_name:
          type:
            - string
            - 'null'
          description: "Наименование варианта отсчёта как в 1С. Показывается как есть, в логике не участвует."
          examples:
            - от даты отгрузки
        stage:
          type:
            - string
            - 'null'
          enum:
            - prepayment
            - advance
            - credit
            - null
          description: "Машинный код этапа оплаты («Контроль»): `prepayment` — предоплата до отгрузки, `advance` — аванс, `credit` — оплата после отгрузки."
          examples:
            - credit
        stage_name:
          type:
            - string
            - 'null'
          description: "Наименование этапа оплаты как в 1С. Только для показа."
          examples:
            - Оплата после отгрузки
        order_uuid:
          description: "UUID заказа клиента, к которому относится строка («Заказ»). Мягкая связь без проверки — заказ мог не приехать на сайт."
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'

