          message_id: msg-shipment-del-s1a2b3c4
          uuid: s1a2b3c4-d5e6-7890-abcd-ef1234567890

    # ── US-02: Партнёры (partner.updated) ────
    PartnerUpdatedFromErpPayload:
      type: object
      required:
        - event
        - message_id
        - uuid
      properties:
        event:
          type: string
          const: partner.updated
        message_id:
          type: string
          description: Уникальный ID сообщения
          examples:
            - 'msg-partner-upd-550e8400'
        uuid:
          $ref: '#/components/schemas/UUID'
        login:
          type: string
          description: Логин (= email), используется для сопоставления по email
          examples:
            - 'ivanov@example.com'
        name:
          type: string
          description: |
            ФИО или название организации (НаименованиеПолное).
            Сохраняется на сайте как рабочее наименование (users.erp_name) —
            по нему менеджеры сличают отчёты сайта и 1С. Личное имя клиента
            (users.name), которое он задаёт в личном кабинете, этим полем
            не перезаписывается (v15.10).
          examples:
            - 'Иванов Иван Иванович'
        phone:
          type:
            - string
            - 'null'
          description: Телефон
          examples:
            - '+77001234567'
        email:
          type: string
          format: email
          description: Email
          examples:
            - 'ivanov@example.com'
        city:
          type:
            - string
            - 'null'
          description: Город из фактического адреса
          examples:
            - 'Екатеринбург'
        country:
          $ref: '#/components/schemas/CountryCode'
        is_active:
          type: boolean
          description: "Активность партнёра: true — активен, false — заблокирован"
          examples:
            - true
        client_status:
          type:
            - string
            - 'null'
          description: |
            Код статуса клиента (уровень лояльности).
            Произвольная строка — соответствует external_id записи ClientStatus на сайте.
            Примеры: "silver", "gold", "diamond", "individual".
          examples:
            - 'gold'
        manager:
          type:
            - object
            - 'null'
          description: |
            Основной менеджер партнёра в 1С (v15.1). Опционально — частичное обновление.
            При наличии — обрабатывается аналогично partner.created:
            сайт ищет PersonalManager по erp_uuid, при отсутствии — создаёт новую запись.
            При null — сбрасывает personal_manager_id пользователя.
            Отсутствие ключа — менеджер не меняется.
          properties:
            uuid:
              type: string
              description: UUID пользователя-менеджера в 1С (Справочник «Пользователи»)
            name:
              type: string
              description: ФИО/наименование менеджера
          required:
            - uuid
            - name

    # ── US-02: Партнёры (partner.created) ────
    PartnerCreatedFromErpPayload:
      type: object
      required:
        - event
        - message_id
        - uuid
        - login
        - name
        - email
        - password
        - country
        - is_active
      properties:
        event:
          type: string
          const: partner.created
        message_id:
          type: string
          description: Уникальный ID сообщения
          examples:
            - 'msg-partner-erp-550e8400'
        uuid:
          $ref: '#/components/schemas/UUID'
        login:
          type: string
          description: Логин (= email)
          examples:
            - 'ivanov@example.com'
        name:
          type: string
          description: |
            ФИО или название организации (НаименованиеПолное).
            Сохраняется на сайте как рабочее наименование (users.erp_name).
            Для впервые создаваемого пользователя оно становится и стартовым
            личным именем (users.name); у существующего личное имя, заданное
            клиентом в кабинете, не перезаписывается (v15.10).
          examples:
            - 'Иванов Иван Иванович'
        phone:
          type:
            - string
            - 'null'
          description: Телефон
          examples:
            - '+77001234567'
        email:
          type: string
          format: email
          description: Email
          examples:
            - 'ivanov@example.com'
        password:
          type: string
          minLength: 1
          maxLength: 32
          description: Пароль пользователя (строка, до 32 символов). Типовое значение — десятичное представление CRC32 от email партнёра
          examples:
            - '2926704424'
        city:
          type:
            - string
            - 'null'
          description: Город из фактического адреса
          examples:
            - 'Екатеринбург'
        country:
          $ref: '#/components/schemas/CountryCode'
        is_active:
          type: boolean
          description: "Активность партнёра: true — активен, false — закрылся (v10)"
          examples:
            - true
        client_status:
          type:
            - string
            - 'null'
          description: |
            Код статуса клиента (уровень лояльности, v11).
            Произвольная строка — соответствует external_id записи ClientStatus на сайте.
            Примеры: "silver", "gold", "diamond", "individual".
          examples:
            - 'gold'
        manager:
          type:
            - object
            - 'null'
          description: |
            Основной менеджер партнёра в 1С (v15). Присутствует всегда в partner.created.
            При null — менеджер не назначен (сбрасывает привязку на сайте).
            Сайт матчит по PersonalManager.erp_uuid; при отсутствии — создаёт новую запись.
          properties:
            uuid:
              type: string
              description: UUID пользователя-менеджера в 1С (Справочник «Пользователи»)
              examples:
                - 'f2c1d4e7-0000-4000-a000-9ab000000000'
            name:
              type: string
              description: ФИО/наименование менеджера
              examples:
                - 'Иванов Иван Иванович'
          required:
            - uuid
            - name

    PartnerCreatedFromSitePayload:
      type: object
      required:
        - event
        - message_id
        - uuid
        - login
        - name
        - email
      properties:
        event:
          type: string
          const: partner.created
        message_id:
          type: string
          description: Уникальный ID сообщения
          examples:
            - 'msg-partner-created-550e8400'
        timestamp:
          $ref: '#/components/schemas/ISO8601DateTime'
        uuid:
          $ref: '#/components/schemas/UUID'
        login:
          type: string
          description: Логин (= email)
        name:
          type: string
          description: ФИО
        phone:
          type:
            - string
            - 'null'
          description: Телефон
        email:
          type: string
          format: email
          description: Email
        is_active:
          type: boolean
          description: |
            Активность пользователя. При регистрации всегда `false` —
            пользователь находится в статусе PROCESSING до проверки менеджером.
          examples:
            - false
        comment:
          type:
            - string
            - 'null'
          description: |
            Секретная ссылка на превью-страницу пользователя для менеджеров.
            Содержит уникальный токен (`view_token`), доступ — только по ссылке.
          examples:
            - 'https://example.com/preview/user/abc123def456'

    # ── US-03: Цены ──────────────────────────
    PriceUpdatedPayload:
      type: object
      required:
