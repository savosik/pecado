<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 1766" font-family="IBM Plex Sans, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2620"/></marker></defs>
<rect width="970" height="1766" fill="#FFFFFF"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#1B2620">Рабочий цикл менеджера отдела продаж</text>
<text x="40" y="70" font-size="13" fill="#5A6862">Ежедневный цикл с недельными и месячными ветвлениями. Формы A1–A7 — см. «Формы отчётов и расчётов»</text>
<polyline points="585,146 585,200" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,276 585,330" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,355 640,353" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="622" y="346" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">нет</text>
<polyline points="585,380 585,440" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595" y="400" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">да</text>
<polyline points="585,516 585,560" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="755,391 755,585 610,585" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,610 585,640" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,716 585,770" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,795 640,793" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="622" y="786" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">да</text>
<polyline points="585,820 585,890" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595" y="840" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">нет</text>
<polyline points="755,831 755,915 610,915" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,940 585,960" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,1036 585,1080" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,1156 585,1210" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,1235 640,1233" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="622" y="1226" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">да</text>
<polyline points="585,1260 585,1330" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595" y="1280" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">нет</text>
<polyline points="755,1271 755,1355 610,1355" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,1380 585,1420" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,1445 610,1445 610,1398 640,1398" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="622" y="1436" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">1–5</text>
<polyline points="610,1445 610,1445 610,1518 640,1518" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="622" y="1436" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">25–31</text>
<polyline points="585,1470 585,1580" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595" y="1490" font-size="12" font-weight="600" text-anchor="start" fill="#1F6F50">прочие</text>
<polyline points="755,1360 930,1360 930,1605 610,1605" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="755,1556 755,1605 610,1605" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="585,1630 585,1670" fill="none" stroke="#1B2620" stroke-width="1.6" marker-end="url(#a)"/>
<circle cx="585" cy="128" r="18" fill="#FFFFFF" stroke="#1B2620" stroke-width="2"/>
<text x="585" y="162" font-size="12" text-anchor="middle" fill="#1B2620">Начало рабочего дня</text>
<rect x="470" y="200" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="234" font-size="12.5" text-anchor="middle" fill="#1B2620">Открыть «Мой месяц»: доход,</text>
<text x="585" y="250" font-size="12.5" text-anchor="middle" fill="#1B2620">план, сколько до начала оплаты</text>
<polygon points="585,330 610,355 585,380 560,355" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="361" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<text x="546" y="352" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">Оплата за базу уже</text>
<text x="546" y="366" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">началась?</text>
<rect x="640" y="315" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="755" y="349" font-size="12.5" text-anchor="middle" fill="#1B2620">Дожать до начала оплаты:</text>
<text x="755" y="365" font-size="12.5" text-anchor="middle" fill="#1B2620">клиенты с наибольшим разрывом</text>
<rect x="470" y="440" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="474" font-size="12.5" text-anchor="middle" fill="#1B2620">Наращивать сверх планки:</text>
<text x="585" y="490" font-size="12.5" text-anchor="middle" fill="#1B2620">каждый рубль даёт 1,9 копейки</text>
<polygon points="585,560 610,585 585,610 560,585" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="591" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<rect x="470" y="640" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="674" font-size="12.5" text-anchor="middle" fill="#1B2620">Отработать обещания оплаты,</text>
<text x="585" y="690" font-size="12.5" text-anchor="middle" fill="#1B2620">назначенные на сегодня</text>
<polygon points="585,770 610,795 585,820 560,795" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="801" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<text x="546" y="792" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">Есть долг старше 15</text>
<text x="546" y="806" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">дней без движения?</text>
<rect x="640" y="755" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="755" y="789" font-size="12.5" text-anchor="middle" fill="#1B2620">Передать долг руководителю с</text>
<text x="755" y="805" font-size="12.5" text-anchor="middle" fill="#1B2620">историей контактов</text>
<polygon points="585,890 610,915 585,940 560,915" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="921" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<rect x="470" y="960" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="994" font-size="12.5" text-anchor="middle" fill="#1B2620">Пять и более результативных</text>
<text x="585" y="1010" font-size="12.5" text-anchor="middle" fill="#1B2620">контактов по списку A2</text>
<rect x="470" y="1080" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="1114" font-size="12.5" text-anchor="middle" fill="#1B2620">Записать контакты, обещания и</text>
<text x="585" y="1130" font-size="12.5" text-anchor="middle" fill="#1B2620">задачи в CRM</text>
<polygon points="585,1210 610,1235 585,1260 560,1235" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="1241" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<text x="546" y="1239" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">Сегодня понедельник?</text>
<rect x="640" y="1195" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="755" y="1221" font-size="12.5" text-anchor="middle" fill="#1B2620">Недельный блок: забытые</text>
<text x="755" y="1237" font-size="12.5" text-anchor="middle" fill="#1B2620">клиенты, новые, фокус-товары,</text>
<text x="755" y="1253" font-size="12.5" text-anchor="middle" fill="#1B2620">сроки по пулу</text>
<polygon points="585,1330 610,1355 585,1380 560,1355" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="1361" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<polygon points="585,1420 610,1445 585,1470 560,1445" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="1451" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<text x="546" y="1442" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">Какое сегодня число</text>
<text x="546" y="1456" font-size="12" font-weight="600" text-anchor="end" fill="#1B2620">месяца?</text>
<rect x="640" y="1360" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="755" y="1394" font-size="12.5" text-anchor="middle" fill="#1B2620">1–5: сверить расчётный лист,</text>
<text x="755" y="1410" font-size="12.5" text-anchor="middle" fill="#1B2620">при расхождении — возражение</text>
<rect x="640" y="1480" width="230" height="76" rx="9" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="755" y="1514" font-size="12.5" text-anchor="middle" fill="#1B2620">25–31: дожим по списку и</text>
<text x="755" y="1530" font-size="12.5" text-anchor="middle" fill="#1B2620">контроль оформления заказов</text>
<polygon points="585,1580 610,1605 585,1630 560,1605" fill="#FFFFFF" stroke="#1B2620" stroke-width="1.6"/>
<text x="585" y="1611" font-size="17" text-anchor="middle" fill="#1B2620">&#215;</text>
<circle cx="585" cy="1688" r="18" fill="#FFFFFF" stroke="#1B2620" stroke-width="4"/>
<text x="585" y="1722" font-size="12" text-anchor="middle" fill="#1B2620">День закрыт</text>
</svg>